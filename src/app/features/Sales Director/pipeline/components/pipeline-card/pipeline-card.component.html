<div
  class="group cursor-pointer rounded-xl border border-slate-200 bg-white p-4 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:border-red-200 hover:shadow-md"
  (click)="onCardClick()"
>

  <!-- ===================================================== -->
  <!-- HEADER -->
  <!-- ===================================================== -->

  <div class="mb-3 flex items-start justify-between gap-3">

    <div class="min-w-0">

      <h4
        class="truncate text-sm font-bold text-slate-900 transition group-hover:text-red-600"
      >
        {{ lead.customerName }}
      </h4>

      <p class="mt-1 truncate text-xs text-slate-500">
        {{ lead.contactPerson }}
      </p>

    </div>


    <!-- PRIORITY -->
    <span
      class="shrink-0 rounded-full border px-2 py-1 text-[10px] font-bold"
      [ngClass]="getPriorityClass()"
    >
      {{ lead.priority }}
    </span>

  </div>


  <!-- ===================================================== -->
  <!-- VALUE -->
  <!-- ===================================================== -->

  <div
    class="mb-3 rounded-lg border border-slate-100 bg-slate-50 px-3 py-2.5"
  >

    <p
      class="text-[10px] font-semibold uppercase tracking-wider text-slate-400"
    >
      Opportunity Value
    </p>

    <p class="mt-1 text-base font-bold text-slate-900">
      {{ formatCurrency(lead.value) }}
    </p>

  </div>


  <!-- ===================================================== -->
  <!-- FOOTER -->
  <!-- ===================================================== -->

  <div
    class="flex items-center justify-between border-t border-slate-100 pt-3"
  >

    <!-- OWNER -->
    <div class="flex min-w-0 items-center gap-2">

      <div
        class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-slate-900 text-[10px] font-bold text-white"
      >
        {{ getInitials() }}
      </div>

      <div class="min-w-0">

        <p class="text-[10px] text-slate-400">
          Owner
        </p>

        <p
          class="truncate text-xs font-semibold text-slate-600"
        >
          {{ lead.owner }}
        </p>

      </div>

    </div>


    <!-- LAST ACTIVITY -->
    <div class="text-right">

      <p class="text-[10px] text-slate-400">
        Last Activity
      </p>

      <p class="mt-0.5 text-[10px] font-medium text-slate-500">
        {{ lead.lastActivity }}
      </p>

    </div>

  </div>

</div>
