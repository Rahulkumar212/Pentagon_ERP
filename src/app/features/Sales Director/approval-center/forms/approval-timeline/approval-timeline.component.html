
<div
  class="rounded-2xl border border-slate-200 bg-white shadow-sm"
>

  <!-- ===================================================== -->
  <!-- HEADER -->
  <!-- ===================================================== -->

  <div
    class="flex items-center justify-between border-b border-slate-100 px-5 py-4"
  >

    <div>

      <h3
        class="text-base font-bold text-slate-900"
      >
        Approval Timeline
      </h3>

      <p
        class="mt-1 text-xs text-slate-500"
      >
        Track the complete approval journey
      </p>

    </div>

    <div
      class="flex items-center gap-2 rounded-full bg-slate-50 px-3 py-1.5"
    >

      <span
        class="h-2 w-2 rounded-full bg-indigo-500"
      ></span>

      <span
        class="text-xs font-semibold text-slate-600"
      >
        {{ timeline.length }} Activities
      </span>

    </div>

  </div>


  <!-- ===================================================== -->
  <!-- TIMELINE -->
  <!-- ===================================================== -->

  <div class="px-5 py-6">

    <div
      *ngFor="
        let item of timeline;
        let i = index;
      "
      class="relative flex gap-4"
    >

      <!-- ================================================= -->
      <!-- LEFT TIMELINE -->
      <!-- ================================================= -->

      <div
        class="relative flex w-10 shrink-0 justify-center"
      >

        <!-- Vertical Line -->

        <div
          *ngIf="!isLastItem(i)"
          class="absolute left-1/2 top-10 h-[calc(100%+1rem)] w-px -translate-x-1/2"
          [ngClass]="getLineClass(i)"
        ></div>


        <!-- Icon -->

        <div
          class="relative z-10 flex h-10 w-10 items-center justify-center rounded-full text-base shadow-sm ring-4 ring-white"
          [ngClass]="getStatusClass(item.status)"
        >
          {{ item.icon }}
        </div>

      </div>


      <!-- ================================================= -->
      <!-- CONTENT -->
      <!-- ================================================= -->

      <div
        class="min-w-0 flex-1 pb-8"
        [class.pb-0]="isLastItem(i)"
      >

        <!-- Top Row -->

        <div
          class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between"
        >

          <div>

            <h4
              class="text-sm font-bold text-slate-900"
            >
              {{ item.title }}
            </h4>

            <div
              class="mt-1 flex flex-wrap items-center gap-2"
            >

              <span
                class="text-xs font-medium text-slate-600"
              >
                {{ item.userName }}
              </span>

              <span
                class="text-slate-300"
              >
                •
              </span>

              <span
                class="text-xs text-slate-500"
              >
                {{ item.userRole }}
              </span>

            </div>

          </div>


          <!-- Date -->

          <span
            class="shrink-0 text-xs text-slate-400"
          >
            {{ item.date }}
          </span>

        </div>


        <!-- Description -->

        <div
          class="mt-3 rounded-xl border border-slate-100 bg-slate-50 px-4 py-3"
        >

          <p
            class="text-xs leading-5 text-slate-600"
          >
            {{ item.description }}
          </p>

        </div>


        <!-- Status -->

        <div class="mt-2">

          <!-- Completed -->

          <span
            *ngIf="item.status === 'completed'"
            class="inline-flex items-center gap-1 rounded-full bg-emerald-50 px-2.5 py-1 text-[11px] font-semibold text-emerald-700"
          >
            ✓ Completed
          </span>


          <!-- Current -->

          <span
            *ngIf="item.status === 'current'"
            class="inline-flex items-center gap-1 rounded-full bg-indigo-50 px-2.5 py-1 text-[11px] font-semibold text-indigo-700"
          >
            ● Current Stage
          </span>


          <!-- Changes Requested -->

          <span
            *ngIf="item.status === 'changes-requested'"
            class="inline-flex items-center gap-1 rounded-full bg-amber-50 px-2.5 py-1 text-[11px] font-semibold text-amber-700"
          >
            ✏ Changes Requested
          </span>


          <!-- Rejected -->

          <span
            *ngIf="item.status === 'rejected'"
            class="inline-flex items-center gap-1 rounded-full bg-red-50 px-2.5 py-1 text-[11px] font-semibold text-red-700"
          >
            ✕ Rejected
          </span>


          <!-- Pending -->

          <span
            *ngIf="item.status === 'pending'"
            class="inline-flex items-center gap-1 rounded-full bg-slate-100 px-2.5 py-1 text-[11px] font-semibold text-slate-500"
          >
            ⏳ Pending
          </span>

        </div>

      </div>

    </div>

  </div>

</div>
