<div
  class="flex flex-wrap items-center justify-end gap-3
         border-t border-gray-100
         bg-gray-50/70
         px-5 py-4"
>

  <!-- Request Changes -->
  <button
    *ngIf="showRequestChanges"
    type="button"
    [disabled]="disabled || loading"
    (click)="onAction('request-changes')"
    class="inline-flex items-center justify-center gap-2
           rounded-lg
           border border-gray-300
           bg-white
           px-4 py-2.5
           text-sm font-medium
           text-gray-700
           transition
           hover:border-gray-400
           hover:bg-gray-50
           disabled:cursor-not-allowed
           disabled:opacity-50"
  >
    <span class="text-base">↩</span>

    Request Changes
  </button>


  <!-- Reject -->
  <button
    type="button"
    [disabled]="disabled || loading"
    (click)="onAction('reject')"
    class="inline-flex items-center justify-center gap-2
           rounded-lg
           border border-red-200
           bg-red-50
           px-4 py-2.5
           text-sm font-medium
           text-red-700
           transition
           hover:bg-red-100
           disabled:cursor-not-allowed
           disabled:opacity-50"
  >
    <span class="text-base">✕</span>

    Reject
  </button>


  <!-- Approve -->
  <button
    type="button"
    [disabled]="disabled || loading"
    (click)="onAction('approve')"
    class="inline-flex items-center justify-center gap-2
           rounded-lg
           bg-emerald-600
           px-5 py-2.5
           text-sm font-semibold
           text-white
           shadow-sm
           transition
           hover:bg-emerald-700
           disabled:cursor-not-allowed
           disabled:opacity-50"
  >

    <span
      *ngIf="!loading"
      class="text-base"
    >
      ✓
    </span>

    <span
      *ngIf="loading"
      class="h-4 w-4 animate-spin
             rounded-full
             border-2
             border-white
             border-t-transparent"
    ></span>

    {{ loading ? 'Processing...' : 'Approve' }}

  </button>

</div>
