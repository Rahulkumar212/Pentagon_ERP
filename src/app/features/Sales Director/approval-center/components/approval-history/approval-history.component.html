
<div class="w-full bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">

  <div
    class="px-5 py-4 border-b border-gray-200 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4"
  >
    <div>
      <h2 class="text-lg font-semibold text-gray-900">
        Approval History
      </h2>

      <p class="text-sm text-gray-500 mt-1">
        View approved physical meetings and telecalling history.
      </p>
    </div>
  </div>

  <div class="px-5 py-4 border-b border-gray-200">
    <div class="flex flex-wrap items-center gap-2">

      <button
        type="button"
        (click)="setFilter('ALL')"
        [ngClass]="
          activeFilter === 'ALL'
            ? 'bg-gray-900 text-white border-gray-900'
            : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'
        "
        class="px-4 py-2 rounded-lg text-sm font-medium border transition-all duration-200"
      >
        All
      </button>

      <button
        type="button"
        (click)="setFilter('PHYSICAL_MEETING')"
        [ngClass]="
          activeFilter === 'PHYSICAL_MEETING'
            ? 'bg-gray-900 text-white border-gray-900'
            : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'
        "
        class="px-4 py-2 rounded-lg text-sm font-medium border transition-all duration-200"
      >
        Physical Meeting
      </button>

      <button
        type="button"
        (click)="setFilter('TELECALLING')"
        [ngClass]="
          activeFilter === 'TELECALLING'
            ? 'bg-gray-900 text-white border-gray-900'
            : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'
        "
        class="px-4 py-2 rounded-lg text-sm font-medium border transition-all duration-200"
      >
        Telecalling
      </button>

    </div>
  </div>

  <div class="p-5">

    @if (activeFilter === 'ALL') {
      <div class="space-y-8">

        <app-physical-meeting-history></app-physical-meeting-history>

        <app-telecalling-history></app-telecalling-history>

      </div>
    }

    @if (activeFilter === 'PHYSICAL_MEETING') {
      <app-physical-meeting-history></app-physical-meeting-history>
    }

    @if (activeFilter === 'TELECALLING') {
      <app-telecalling-history></app-telecalling-history>
    }

  </div>

</div>
