<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">

  <!-- Total Activities -->
  <div
    class="group rounded-2xl border border-slate-200 bg-white p-5 shadow-sm
           transition-all duration-200 hover:-translate-y-1 hover:shadow-md"
  >
    <div class="flex items-start justify-between">

      <div>
        <p class="text-sm font-medium text-slate-500">
          Total Activities
        </p>

        <h3 class="mt-2 text-2xl font-bold text-slate-900">
          {{ totalActivities | number }}
        </h3>

        <p class="mt-1 text-xs text-slate-400">
          All recorded activities
        </p>
      </div>

      <div
        class="flex h-11 w-11 items-center justify-center rounded-xl
               bg-slate-100 text-slate-700"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 5H7a2 2 0 00-2 2v11a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a3 3 0 006 0M9 5h6"
          />
        </svg>
      </div>

    </div>
  </div>


  <!-- Created -->
  <div
    class="group rounded-2xl border border-emerald-100 bg-white p-5 shadow-sm
           transition-all duration-200 hover:-translate-y-1 hover:shadow-md"
  >
    <div class="flex items-start justify-between">

      <div>
        <p class="text-sm font-medium text-slate-500">
          Created
        </p>

        <h3 class="mt-2 text-2xl font-bold text-slate-900">
          {{ createdCount | number }}
        </h3>

        <p class="mt-1 text-xs text-emerald-600">
          New records created
        </p>
      </div>

      <div
        class="flex h-11 w-11 items-center justify-center rounded-xl
               bg-emerald-50 text-emerald-600"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 4v16m8-8H4"
          />
        </svg>
      </div>

    </div>
  </div>


  <!-- Updated -->
  <div
    class="group rounded-2xl border border-blue-100 bg-white p-5 shadow-sm
           transition-all duration-200 hover:-translate-y-1 hover:shadow-md"
  >
    <div class="flex items-start justify-between">

      <div>
        <p class="text-sm font-medium text-slate-500">
          Updated
        </p>

        <h3 class="mt-2 text-2xl font-bold text-slate-900">
          {{ updatedCount | number }}
        </h3>

        <p class="mt-1 text-xs text-blue-600">
          Records modified
        </p>
      </div>

      <div
        class="flex h-11 w-11 items-center justify-center rounded-xl
               bg-blue-50 text-blue-600"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M16.862 3.487a2.25 2.25 0 013.182 3.182L8.25 18.463 4 19.75l1.287-4.25L16.862 3.487z"
          />
        </svg>
      </div>

    </div>
  </div>


  <!-- Deleted -->
  <div
    class="group rounded-2xl border border-red-100 bg-white p-5 shadow-sm
           transition-all duration-200 hover:-translate-y-1 hover:shadow-md"
  >
    <div class="flex items-start justify-between">

      <div>
        <p class="text-sm font-medium text-slate-500">
          Deleted
        </p>

        <h3 class="mt-2 text-2xl font-bold text-slate-900">
          {{ deletedCount | number }}
        </h3>

        <p class="mt-1 text-xs text-red-600">
          Records removed
        </p>
      </div>

      <div
        class="flex h-11 w-11 items-center justify-center rounded-xl
               bg-red-50 text-red-600"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 7h12M9 7V5h6v2m-8 0l.75 12h8.5L17 7M10 11v5m4-5v5"
          />
        </svg>
      </div>

    </div>
  </div>

</div>
