
<div class="min-h-full bg-slate-50 p-4 sm:p-6 lg:p-8">


  <!-- ================================================= -->
  <!-- PAGE HEADER -->
  <!-- ================================================= -->

  <div
    class="mb-6 flex flex-col gap-4
           lg:flex-row lg:items-center
           lg:justify-between"
  >

    <div>

      <div class="flex items-center gap-2">

        <div
          class="flex h-10 w-10 items-center justify-center
                 rounded-xl bg-slate-900 text-white"
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h6l5 5v11a2 2 0 01-2 2z"
            />
          </svg>

        </div>

        <div>

          <h1
            class="text-xl font-semibold text-slate-900"
          >
            Audit Logs
          </h1>

          <p
            class="mt-0.5 text-sm text-slate-500"
          >
            Monitor and track important system activities
          </p>

        </div>

      </div>

    </div>


    <!-- Current Status -->
    <div
      class="inline-flex w-fit items-center gap-2
             rounded-full border border-emerald-100
             bg-emerald-50 px-3 py-1.5"
    >

      <span
        class="h-2 w-2 rounded-full bg-emerald-500"
      ></span>

      <span
        class="text-xs font-medium text-emerald-700"
      >
        Audit Monitoring Active
      </span>

    </div>

  </div>



  <!-- ================================================= -->
  <!-- SUMMARY -->
  <!-- ================================================= -->

  <div class="mb-6">

    <app-audit-summary
      [totalActivities]="totalActivities"
      [createdCount]="createdCount"
      [updatedCount]="updatedCount"
      [deletedCount]="deletedCount">
    </app-audit-summary>

  </div>



  <!-- ================================================= -->
  <!-- FILTER -->
  <!-- ================================================= -->

  <div class="mb-6">

    <app-audit-filter
      (filterChange)="onFilterChange($event)"
      (reset)="onFilterReset()">
    </app-audit-filter>

  </div>



  <!-- ================================================= -->
  <!-- AUDIT TABLE -->
  <!-- ================================================= -->

  <app-audit-table
    [logs]="filteredLogs"
    (logSelected)="openAuditDetail($event)">
  </app-audit-table>


  <!-- ================================================= -->
  <!-- DETAIL DRAWER -->
  <!-- ================================================= -->

  @if (selectedLog) {

    <app-audit-detail
      [log]="selectedLog"
      (close)="closeAuditDetail()">
    </app-audit-detail>

  }

</div>
