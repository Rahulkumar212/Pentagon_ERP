<div class="flex flex-col gap-6">

  <!-- ====================================================== -->
  <!-- Header -->
  <!-- ====================================================== -->

  <app-expenses-header
    (newClaim)="openExpenseClaimModal()">
  </app-expenses-header>

  <!-- ====================================================== -->
  <!-- Expense Claims -->
  <!-- ====================================================== -->

  <app-expenses-claims-table
    (approve)="openApprovalModal()"
    (reject)="openApprovalModal()"
    (viewPayslip)="openReimbursementModal()">
  </app-expenses-claims-table>

  <!-- ====================================================== -->
  <!-- Expense Claim Modal -->
  <!-- ====================================================== -->

  @if (showExpenseClaimModal) {

    <app-expense-claim-modal
      (close)="closeExpenseClaimModal()">
    </app-expense-claim-modal>

  }

  <!-- ====================================================== -->
  <!-- Approval Modal -->
  <!-- ====================================================== -->

  @if (showApprovalModal) {

    <app-approve-expense-modal
      (close)="closeApprovalModal()">
    </app-approve-expense-modal>

  }

  <!-- ====================================================== -->
  <!-- Reimbursement Modal -->
  <!-- ====================================================== -->

  @if (showReimbursementModal) {

    <app-reimbursement-modal
      (close)="closeReimbursementModal()">
    </app-reimbursement-modal>

  }

</div>
