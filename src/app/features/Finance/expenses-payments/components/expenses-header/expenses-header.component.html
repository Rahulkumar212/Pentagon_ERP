<div class="rounded-xl border border-gray-200 bg-white px-5 py-4 shadow-sm">

  <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">

    <!-- Left -->

    <div class="flex items-start gap-3">

      <!-- Icon -->

      <div
        class="flex h-9 w-9 items-center justify-center rounded-lg bg-red-50 text-red-800">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2">

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 14l2-2 4 4m0-8H7a2 2 0 00-2 2v8a2 2 0 002 2h10a2 2 0 002-2V8a2 2 0 00-2-2zm0 0V5a2 2 0 00-2-2H9a2 2 0 00-2 2v1"/>

        </svg>

      </div>

      <!-- Title -->

      <div>

        <h1 class="text-xl font-bold text-slate-900">

          Employee Expenses & Outward Claims

        </h1>

        <p class="mt-1 text-sm text-slate-500">

          Manage organizational expense claims, audit travel reimbursements,
          and approve employee payouts.

        </p>

      </div>

    </div>

    <!-- Right -->

    <button
      type="button"
      (click)="createExpenseClaim()"
      class="inline-flex items-center gap-2 rounded-lg bg-red-800 px-4 py-2 text-xs font-semibold text-white transition hover:bg-red-900">

      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-4 w-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2">

        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 5v14m7-7H5"/>

      </svg>

      New Expense Claim

    </button>

  </div>

</div>
