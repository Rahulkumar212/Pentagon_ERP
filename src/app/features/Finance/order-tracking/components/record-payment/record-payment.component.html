<!-- ===================================================== -->
<!-- OVERLAY -->
<!-- ===================================================== -->

<div
  class="fixed inset-0 z-50
         bg-black/40 backdrop-blur-sm
         flex items-center justify-center
         p-4">


  <!-- =================================================== -->
  <!-- MODAL -->
  <!-- =================================================== -->

  <div
    class="w-full max-w-lg
           bg-white rounded-2xl
           shadow-2xl
           overflow-hidden">


    <!-- ================================================= -->
    <!-- HEADER -->
    <!-- ================================================= -->

    <div
      class="flex items-center justify-between
             px-6 py-5
             border-b border-gray-200">


      <div>

        <h2
          class="text-lg font-semibold
                 text-gray-900">

          Record Payment

        </h2>


        <p
          class="mt-1 text-sm
                 text-gray-500">

          Enter payment details for this order.

        </p>

      </div>


      <button
        type="button"
        (click)="onCancel()"
        class="w-9 h-9
               flex items-center justify-center
               rounded-lg
               text-gray-400
               hover:bg-gray-100
               hover:text-gray-700
               transition">

        ✕

      </button>

    </div>


    <!-- ================================================= -->
    <!-- BODY -->
    <!-- ================================================= -->

    <div
      class="px-6 py-6 space-y-5">


      <!-- ================================================= -->
      <!-- PAYMENT DATE -->
      <!-- ================================================= -->

      <div>

        <label
          class="block mb-2
                 text-sm font-medium
                 text-gray-700">

          Payment Date
          <span class="text-red-500">*</span>

        </label>


        <input
          type="date"
          [(ngModel)]="paymentDate"
          class="w-full
                 rounded-lg
                 border border-gray-300
                 px-3 py-2.5
                 text-sm
                 text-gray-800
                 focus:outline-none
                 focus:ring-2
                 focus:ring-blue-100
                 focus:border-blue-500" />

      </div>


      <!-- ================================================= -->
      <!-- PAYMENT AMOUNT -->
      <!-- ================================================= -->

      <div>

        <label
          class="block mb-2
                 text-sm font-medium
                 text-gray-700">

          Payment Amount
          <span class="text-red-500">*</span>

        </label>


        <div
          class="relative">

          <span
            class="absolute left-3 top-1/2
                   -translate-y-1/2
                   text-gray-500
                   text-sm">

            ₹

          </span>


          <input
            type="number"
            min="1"
            [(ngModel)]="paymentAmount"
            placeholder="Enter payment amount"
            class="w-full
                   rounded-lg
                   border border-gray-300
                   pl-8 pr-3 py-2.5
                   text-sm
                   text-gray-800
                   focus:outline-none
                   focus:ring-2
                   focus:ring-blue-100
                   focus:border-blue-500" />

        </div>

      </div>


      <!-- ================================================= -->
      <!-- PAYMENT MODE -->
      <!-- ================================================= -->

      <div>

        <label
          class="block mb-2
                 text-sm font-medium
                 text-gray-700">

          Payment Mode
          <span class="text-red-500">*</span>

        </label>


        <select
          [(ngModel)]="paymentMode"
          class="w-full
                 rounded-lg
                 border border-gray-300
                 bg-white
                 px-3 py-2.5
                 text-sm
                 text-gray-800
                 focus:outline-none
                 focus:ring-2
                 focus:ring-blue-100
                 focus:border-blue-500">


          <option value="">
            Select Payment Mode
          </option>


          @for (
            mode of paymentModes;
            track mode
          ) {

            <option
              [value]="mode">

              {{ mode }}

            </option>

          }

        </select>

      </div>


      <!-- ================================================= -->
      <!-- TRANSACTION REFERENCE -->
      <!-- ================================================= -->

      <div>

        <label
          class="block mb-2
                 text-sm font-medium
                 text-gray-700">

          Transaction Reference

        </label>


        <input
          type="text"
          [(ngModel)]="transactionReference"
          placeholder="Enter transaction / cheque reference"
          class="w-full
                 rounded-lg
                 border border-gray-300
                 px-3 py-2.5
                 text-sm
                 text-gray-800
                 focus:outline-none
                 focus:ring-2
                 focus:ring-blue-100
                 focus:border-blue-500" />

      </div>


      <!-- ================================================= -->
      <!-- REMARKS -->
      <!-- ================================================= -->

      <div>

        <label
          class="block mb-2
                 text-sm font-medium
                 text-gray-700">

          Remarks

        </label>


        <textarea
          rows="3"
          [(ngModel)]="remarks"
          placeholder="Add payment remarks..."
          class="w-full
                 rounded-lg
                 border border-gray-300
                 px-3 py-2.5
                 text-sm
                 text-gray-800
                 resize-none
                 focus:outline-none
                 focus:ring-2
                 focus:ring-blue-100
                 focus:border-blue-500">
        </textarea>

      </div>

    </div>


    <!-- ================================================= -->
    <!-- FOOTER -->
    <!-- ================================================= -->

    <div
      class="flex items-center
             justify-end gap-3
             px-6 py-4
             bg-gray-50
             border-t border-gray-200">


      <button
        type="button"
        (click)="onCancel()"
        class="px-4 py-2.5
               rounded-lg
               border border-gray-300
               text-sm font-medium
               text-gray-700
               hover:bg-gray-100
               transition">

        Cancel

      </button>


      <button
        type="button"
        (click)="onSubmit()"
        [disabled]="
          !paymentDate ||
          !paymentAmount ||
          paymentAmount <= 0 ||
          !paymentMode ||
          isSubmitting
        "
        class="px-5 py-2.5
               rounded-lg
               bg-blue-600
               text-white
               text-sm font-semibold
               hover:bg-blue-700
               disabled:opacity-50
               disabled:cursor-not-allowed
               transition">

        {{
          isSubmitting
            ? 'Saving...'
            : 'Record Payment'
        }}

      </button>

    </div>

  </div>

</div>
