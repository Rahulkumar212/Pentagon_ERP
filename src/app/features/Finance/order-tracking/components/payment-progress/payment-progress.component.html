<div
  class="w-full
         rounded-xl
         border border-gray-200
         bg-white
         px-4 py-4">

  <!-- ================================================= -->
  <!-- HEADER -->
  <!-- ================================================= -->

  <div
    class="flex items-center
           justify-between
           gap-3">

    <div>

      <p
        class="text-[11px]
               uppercase
               tracking-wider
               font-medium
               text-gray-400">

        Payment Progress

      </p>

      <p
        class="mt-1
               text-lg
               font-bold
               text-gray-900">

        {{ formatAmount(paidAmount) }}

      </p>

    </div>


    <!-- Percentage -->

    <div
      class="text-right">

      <p
        class="text-lg
               font-bold
               text-gray-900">

        {{ paymentPercentage | number:'1.0-0' }}%

      </p>

      <p
        class="text-[11px]
               text-gray-400">

        Paid

      </p>

    </div>

  </div>


  <!-- ================================================= -->
  <!-- PROGRESS BAR -->
  <!-- ================================================= -->

  <div
    class="mt-3">

    <div
      class="h-2.5
             w-full
             overflow-hidden
             rounded-full
             bg-gray-100">

      <div
        class="h-full
               rounded-full
               bg-green-500
               transition-all
               duration-500"
        [style.width.%]="paymentPercentage">
      </div>

    </div>

  </div>


  <!-- ================================================= -->
  <!-- AMOUNT DETAILS -->
  <!-- ================================================= -->

  <div
    class="mt-3
           grid
           grid-cols-2
           gap-3">

    <!-- Paid -->

    <div
      class="rounded-lg
             bg-green-50
             border border-green-100
             px-3 py-2">

      <p
        class="text-[10px]
               uppercase
               tracking-wide
               text-green-600">

        Paid Amount

      </p>

      <p
        class="mt-0.5
               text-sm
               font-semibold
               text-green-700">

        {{ formatAmount(paidAmount) }}

      </p>

    </div>


    <!-- Remaining -->

    <div
      class="rounded-lg
             bg-orange-50
             border border-orange-100
             px-3 py-2">

      <p
        class="text-[10px]
               uppercase
               tracking-wide
               text-orange-600">

        Remaining

      </p>

      <p
        class="mt-0.5
               text-sm
               font-semibold
               text-orange-700">

        {{ formatAmount(remainingAmount) }}

      </p>

    </div>

  </div>


  <!-- ================================================= -->
  <!-- TOTAL -->
  <!-- ================================================= -->

  <div
    class="mt-3
           flex items-center
           justify-between
           text-xs">

    <span
      class="text-gray-400">

      Total Order Amount

    </span>

    <span
      class="font-semibold
             text-gray-700">

      {{ formatAmount(totalAmount) }}

    </span>

  </div>

</div>
