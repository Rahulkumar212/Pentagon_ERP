<div class="bg-white
         border border-gray-200
         rounded-xl
         shadow-sm
         p-4">

    <div class="flex flex-col xl:flex-row
           gap-3">

        <!-- ================================================= -->
        <!-- SEARCH -->
        <!-- ================================================= -->

        <div class="relative flex-1">

            <span class="absolute
               left-4
               top-1/2
               -translate-y-1/2
               text-gray-400">

                🔍

            </span>

            <input type="text" [(ngModel)]="search" (input)="onFilterChange()"
                placeholder="Search by Order #, Customer, Phone, or Item..." class="w-full
               pl-11
               pr-4
               py-3
               border
               border-gray-300
               rounded-lg
               text-sm
               focus:outline-none
               focus:border-red-700" />

        </div>


        <!-- ================================================= -->
        <!-- PAYMENT STATUS -->
        <!-- ================================================= -->

        <div class="flex
             items-center
             border
             border-gray-200
             rounded-lg
             overflow-hidden">

            <button type="button" (click)="setPaymentStatus('ALL')" [class]="paymentStatus === 'ALL'
          ? 'bg-gray-100 font-semibold'
          : ''" class="px-4 py-2 text-sm">

                All

            </button>

            <button type="button" (click)="setPaymentStatus('PAID')" [class]="paymentStatus === 'PAID'
          ? 'bg-green-50 text-green-700 font-semibold'
          : ''" class="px-4 py-2 text-sm">

                Paid

            </button>

            <button type="button" (click)="setPaymentStatus('PARTIALLY_PAID')" [class]="paymentStatus === 'PARTIALLY_PAID'
          ? 'bg-amber-50 text-amber-700 font-semibold'
          : ''" class="px-4 py-2 text-sm">

                Partially Paid

            </button>

            <button type="button" (click)="setPaymentStatus('UNPAID')" [class]="paymentStatus === 'UNPAID'
          ? 'bg-red-50 text-red-700 font-semibold'
          : ''" class="px-4 py-2 text-sm">

                Unpaid

            </button>

        </div>


        <!-- ================================================= -->
        <!-- DELIVERY STAGE -->
        <!-- ================================================= -->

        <select [(ngModel)]="deliveryStage" (change)="onFilterChange()" class="px-4 py-3
             border border-gray-300
             rounded-lg
             text-sm
             min-w-[200px]">

            <option value="ALL">
                All Delivery Stages
            </option>

            <option value="PENDING">
                Pending
            </option>

            <option value="IN_PRODUCTION">
                In Production
            </option>

            <option value="DISPATCHED">
                Dispatched
            </option>

            <option value="DELIVERED">
                Delivered
            </option>

            <option value="CANCELLED">
                Cancelled
            </option>

        </select>


        <!-- ================================================= -->
        <!-- SORT -->
        <!-- ================================================= -->

        <select [(ngModel)]="sortBy" (change)="onFilterChange()" class="px-4 py-3
             border border-gray-300
             rounded-lg
             text-sm
             min-w-[170px]">

            <option value="NEWEST">
                Newest First
            </option>

            <option value="OLDEST">
                Oldest First
            </option>

            <option value="AMOUNT_HIGH">
                Amount High → Low
            </option>

            <option value="AMOUNT_LOW">
                Amount Low → High
            </option>

        </select>


        <!-- ================================================= -->
        <!-- VIEW MODE -->
        <!-- ================================================= -->

        <div class="flex
         overflow-hidden
         rounded-lg
         border
         border-gray-200
         bg-white">

            <!-- GRID / CARD VIEW -->

            <button type="button" (click)="setViewMode('GRID')" [class]="
      viewMode === 'GRID'
        ? 'bg-red-50 text-red-800 font-semibold'
        : 'text-gray-500 hover:bg-gray-50'
    " class="px-4 py-3
           text-sm
           transition
           duration-200" aria-label="Grid view">

                ⊞

            </button>


            <!-- LIST VIEW -->

            <button type="button" (click)="setViewMode('LIST')" [class]="
      viewMode === 'LIST'
        ? 'bg-red-50 text-red-800 font-semibold'
        : 'text-gray-500 hover:bg-gray-50'
    " class="px-4 py-3
           text-sm
           transition
           duration-200" aria-label="List view">

                ☰

            </button>

        </div>

    </div>

</div>
