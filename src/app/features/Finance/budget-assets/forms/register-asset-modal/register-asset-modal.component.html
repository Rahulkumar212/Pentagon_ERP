<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40">

  <div
    class="w-full max-w-3xl rounded-xl bg-white shadow-2xl">

    <!-- Header -->

    <div
      class="flex items-center justify-between border-b px-6 py-4">

      <div>

        <h2 class="text-lg font-semibold">

          Register Fixed Asset

        </h2>

        <p class="mt-1 text-xs text-slate-500">

          Add a new company asset into the fixed asset register.

        </p>

      </div>

      <button
        (click)="cancel()"
        class="text-xl text-slate-400 hover:text-slate-700">

        ×

      </button>

    </div>

    <!-- Form -->

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="space-y-5 p-6">

      <div class="grid grid-cols-2 gap-4">

        <div>

          <label class="mb-1 block text-xs font-semibold">

            Asset Name

          </label>

          <input
            formControlName="assetName"
            class="w-full rounded-lg border px-3 py-2 text-sm">

        </div>

        <div>

          <label class="mb-1 block text-xs font-semibold">

            Category

          </label>

          <select
            formControlName="category"
            class="w-full rounded-lg border px-3 py-2 text-sm">

            @for(item of categories; track item){

              <option [value]="item">

                {{ item }}

              </option>

            }

          </select>

        </div>

      </div>

      <div class="grid grid-cols-2 gap-4">

        <div>

          <label class="mb-1 block text-xs font-semibold">

            Department

          </label>

          <select
            formControlName="department"
            class="w-full rounded-lg border px-3 py-2 text-sm">

            @for(item of departments; track item){

              <option [value]="item">

                {{ item }}

              </option>

            }

          </select>

        </div>

        <div>

          <label class="mb-1 block text-xs font-semibold">

            Purchase Date

          </label>

          <input
            type="date"
            formControlName="purchaseDate"
            class="w-full rounded-lg border px-3 py-2 text-sm">

        </div>

      </div>

      <div class="grid grid-cols-2 gap-4">

        <div>

          <label class="mb-1 block text-xs font-semibold">

            Vendor

          </label>

          <input
            formControlName="vendor"
            class="w-full rounded-lg border px-3 py-2 text-sm">

        </div>

        <div>

          <label class="mb-1 block text-xs font-semibold">

            Asset Value (₹)

          </label>

          <input
            type="number"
            formControlName="assetValue"
            class="w-full rounded-lg border px-3 py-2 text-sm">

        </div>

      </div>

      <div class="grid grid-cols-3 gap-4">

        <div>

          <label class="mb-1 block text-xs font-semibold">

            Depreciation %

          </label>

          <input
            type="number"
            formControlName="depreciation"
            class="w-full rounded-lg border px-3 py-2 text-sm">

        </div>

        <div>

          <label class="mb-1 block text-xs font-semibold">

            Useful Life

          </label>

          <input
            type="number"
            formControlName="usefulLife"
            class="w-full rounded-lg border px-3 py-2 text-sm">

        </div>

        <div>

          <label class="mb-1 block text-xs font-semibold">

            Status

          </label>

          <select
            formControlName="status"
            class="w-full rounded-lg border px-3 py-2 text-sm">

            @for(item of statusOptions; track item){

              <option [value]="item">

                {{ item }}

              </option>

            }

          </select>

        </div>

      </div>

      <div>

        <label class="mb-1 block text-xs font-semibold">

          Asset Location

        </label>

        <input
          formControlName="location"
          class="w-full rounded-lg border px-3 py-2 text-sm">

      </div>

      <div>

        <label class="mb-1 block text-xs font-semibold">

          Description

        </label>

        <textarea
          rows="4"
          formControlName="description"
          class="w-full rounded-lg border px-3 py-2 text-sm resize-none">

        </textarea>

      </div>

      <!-- Footer -->

      <div
        class="flex justify-end gap-3 border-t pt-4">

        <button
          type="button"
          (click)="cancel()"
          class="rounded-lg bg-gray-100 px-5 py-2 text-sm">

          Cancel

        </button>

        <button
          type="submit"
          class="rounded-lg bg-red-800 px-6 py-2 text-sm text-white hover:bg-red-900">

          Register Asset

        </button>

      </div>

    </form>

  </div>

</div>
