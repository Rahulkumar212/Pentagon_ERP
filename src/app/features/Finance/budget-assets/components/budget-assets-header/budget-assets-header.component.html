<div class="rounded-xl border border-gray-200 bg-white px-4 py-3 shadow-sm">

  <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">


      <!-- ================= Left ================= -->

      <div class="flex items-start gap-3">

        <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-red-50 text-red-800">

          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">

            <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h18M6 7v13m12-13v13M8 3h8M5 20h14" />

          </svg>

        </div>

        <div>

          <h1 class="text-lg font-semibold text-slate-900">

            Budgets, Assets & Capital Planning

          </h1>

          <p class="mt-0.5 text-xs text-slate-500">

            Monitor departmental budgets, manage fixed assets and
            statutory taxation across the organization.

          </p>

        </div>

      </div>

      <!-- ================= Right ================= -->

      <div class="flex items-center gap-5">

        <!-- Tabs -->

        <div class="inline-flex rounded-lg border border-gray-200 bg-slate-100 p-1">

          <button (click)="changeTab('budget')" class="rounded-md px-4 py-2 text-xs font-semibold transition"
            [class.bg-red-800]="selectedTab === 'budget'" [class.text-white]="selectedTab === 'budget'">

            Budget Tracking

          </button>

          <button (click)="changeTab('assets')" class="rounded-md px-4 py-2 text-xs font-semibold transition"
            [class.bg-red-800]="selectedTab === 'assets'" [class.text-white]="selectedTab === 'assets'">

            Fixed Asset Register

          </button>

        </div>

      </div>


  </div>

</div>
