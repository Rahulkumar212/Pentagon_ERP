<div class="flex flex-col gap-6">

  <!-- Header -->

  <app-treasury-header
    (bankChanged)="onBankChanged($event)"
    (tabChanged)="changeTab($event)">
  </app-treasury-header>

  <!-- ====================================================== -->
  <!-- Dashboard -->
  <!-- ====================================================== -->

  @if (selectedTab() === 'Dashboard') {

    <app-treasury-dashboard-cards></app-treasury-dashboard-cards>

    <app-bank-balance-chart></app-bank-balance-chart>

    <app-cash-position-summary></app-cash-position-summary>

  }

  <!-- ====================================================== -->
  <!-- Accounts -->
  <!-- ====================================================== -->

  @if (selectedTab() === 'Accounts') {

    <app-bank-accounts></app-bank-accounts>

  }

  <!-- ====================================================== -->
  <!-- Reconciliation -->
  <!-- ====================================================== -->

  @if (selectedTab() === 'Reconciliation') {

    <app-reconciliation-center></app-reconciliation-center>

    <app-reconciliation-history></app-reconciliation-history>

  }

  <!-- ====================================================== -->
  <!-- Payments -->
  <!-- ====================================================== -->

  @if (selectedTab() === 'Payments') {

    <app-payment-approval-table></app-payment-approval-table>

  }

  <!-- ====================================================== -->
  <!-- Statements -->
  <!-- ====================================================== -->

  @if (selectedTab() === 'Statements') {

    <app-statement-upload></app-statement-upload>

  }

</div>
