<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3">

  @for(card of cards; track card.title){

  <div
    class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm transition hover:shadow-md">

    <div class="flex items-start justify-between">

      <div>

        <p
          class="text-[10px] font-bold uppercase tracking-[0.18em] text-slate-500">

          {{ card.title }}

        </p>

        <h2
          class="mt-3 text-2xl font-bold"
          [class]="card.color">

          {{ card.value }}

        </h2>

      </div>

      <div
        class="rounded-lg p-3"
        [class]="card.bg">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5 text-slate-600"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor">

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8c-3.314 0-6 2.686-6 6v2h12v-2c0-3.314-2.686-6-6-6zm0-6v6m-6 6H4m16 0h-2"/>

        </svg>

      </div>

    </div>

    <div class="mt-5 border-t border-gray-100 pt-3">

      <span
        class="text-xs font-medium text-slate-500">

        {{ card.change }}

      </span>

    </div>

  </div>

  }

</div>
