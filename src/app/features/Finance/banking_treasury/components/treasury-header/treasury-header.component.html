<div class="rounded-xl border border-gray-200 bg-white px-4 py-3 shadow-sm">

  <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">

   <div class="flex items-center justify-between">

  <!-- Left -->

  <div class="flex items-start gap-3">

    <div
      class="flex h-8 w-8 items-center justify-center rounded-lg bg-red-50 text-red-800">

      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-4 w-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2">

        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3 10h18M5 10V7l7-4 7 4v3M6 10v8m4-8v8m4-8v8m4-8v8M4 18h16"/>

      </svg>

    </div>

    <div>

      <h1 class="text-lg font-semibold text-slate-900">

        Treasury & Banking

      </h1>

      <p class="mt-0.5 text-xs text-slate-500">

        Treasury operations, bank accounts and reconciliation.

      </p>

    </div>

  </div>

  <!-- Right -->

  <div class="flex items-center gap-3">

    <label class="text-xs font-medium text-slate-600">

      Bank

    </label>

    <select
      [(ngModel)]="selectedBank"
      (change)="onBankChange()"
      class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-xs">

      @for(bank of banks; track bank){

      <option [value]="bank">

        {{ bank }}

      </option>

      }

    </select>

  </div>

</div>

<!-- Tabs -->

<div class="mt-5 flex flex-wrap gap-2 border-b border-gray-200 pb-3">

  @for(tab of tabs; track tab){

  <button
    (click)="changeTab(tab)"
    class="rounded-lg px-4 py-2 text-xs font-semibold transition-all"
    [class.bg-red-800]="selectedTab===tab"
    [class.text-white]="selectedTab===tab"
    [class.bg-slate-100]="selectedTab!==tab"
    [class.text-slate-700]="selectedTab!==tab">

    {{ tab }}

  </button>

  }

</div>

  </div>

</div>
