<div class="mb-5 flex items-center justify-between">

  <div>

    <h2 class="text-base font-semibold text-slate-900">
      Company Bank Accounts
    </h2>

    <p class="mt-1 text-xs text-slate-500">
      Manage company bank accounts and treasury balances.
    </p>

  </div>

  <button
    (click)="openAddBankAccount()"
    class="rounded-lg bg-red-800 px-4 py-2 text-xs font-semibold text-white hover:bg-red-900">

    + Add Bank Account

  </button>

</div>

<div class="grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-3">

  @for (bank of banks(); track bank.id) {

    <div
      (click)="selectBank(bank.id)"
      class="cursor-pointer rounded-xl border bg-white p-4 shadow-sm transition-all duration-300 hover:-translate-y-0.5 hover:shadow-md"

      [class.border-red-700]="selectedBank() === bank.id"
      [class.ring-2]="selectedBank() === bank.id"
      [class.ring-red-200]="selectedBank() === bank.id"
      [class.border-gray-200]="selectedBank() !== bank.id">

      <!-- Header -->

      <div class="flex items-start justify-between">

        <span
          class="rounded-md bg-blue-50 px-2 py-0.5 text-[9px] font-bold tracking-wider text-blue-700">

          {{ bank.type }}

        </span>

        <button
          (click)="editBank(bank); $event.stopPropagation()"
          class="rounded p-1 hover:bg-slate-100">

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4 text-slate-500"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 7l1.5-1.5a2.121 2.121 0 013 3L20 10m-3-3l-8.5 8.5L6 18l2.5-.5L17 9"/>

          </svg>

        </button>

      </div>

      <!-- Bank -->

      <div class="mt-3">

        <h3 class="text-sm font-semibold text-slate-900">
          {{ bank.name }}
        </h3>

        <p class="mt-1 text-[11px] tracking-wide text-slate-500">
          {{ bank.accountNo }}
        </p>

      </div>

      <div class="my-3 border-t border-gray-200"></div>

      <!-- Balance -->

      <div class="flex items-center justify-between">

        <span class="text-[10px] uppercase tracking-wider text-slate-400">
          Available Balance
        </span>

        <span class="text-lg font-bold text-slate-900">
          ₹{{ bank.balance | number }}
        </span>

      </div>

      <!-- Actions -->

      <div class="mt-5 flex gap-2">

        <button
          (click)="viewBank(bank); $event.stopPropagation()"
          class="flex-1 rounded-md border border-gray-300 bg-white py-2 text-xs font-semibold hover:bg-gray-50">

          View

        </button>

        <button
          (click)="uploadStatement(bank); $event.stopPropagation()"
          class="flex-1 rounded-md bg-blue-600 py-2 text-xs font-semibold text-white hover:bg-blue-700">

          Upload

        </button>

      </div>

    </div>

  }

</div>

@if(showAddBankModal()) {

<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">

  <div
    class="relative max-h-[90vh] w-full max-w-3xl overflow-y-auto rounded-2xl bg-white shadow-2xl">

    <app-add-bank-account
      [bank]="selectedBankData()"
      (close)="closeModals()">
    </app-add-bank-account>

  </div>

</div>

}

@if(showUploadStatementModal()) {

<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">

  <div
    class="relative max-h-[90vh] w-full max-w-4xl overflow-y-auto rounded-2xl bg-white shadow-2xl">

    <app-upload-bank-statement
      [bank]="selectedBankData()"
      (close)="closeModals()">
    </app-upload-bank-statement>

  </div>

</div>

}
