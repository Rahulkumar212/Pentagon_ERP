<!-- Header -->

<div class="flex items-center justify-between border-b border-gray-200 px-6 py-4">

  <div>

    <h2 class="text-lg font-semibold text-slate-900">

      Add Bank Account

    </h2>

    <p class="mt-1 text-xs text-slate-500">

      Register a new corporate bank account for treasury operations.

    </p>

  </div>

  <button

    (click)="cancel()"

    class="text-xs font-semibold uppercase text-slate-400 hover:text-slate-700">

    Close

  </button>

</div>

<!-- Body -->

<form

  [formGroup]="form"

  (ngSubmit)="submit()"

  class="space-y-5 p-6">

  <!-- Row 1 -->

  <div class="grid grid-cols-2 gap-4">

    <div>

      <label class="mb-1 block text-[10px] font-semibold uppercase tracking-wider text-slate-500">

        Bank Name

      </label>

      <select

        formControlName="bankName"

        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm">

        <option value="">

          Select Bank

        </option>

        @for(bank of banks; track bank){

        <option [value]="bank">

          {{ bank }}

        </option>

        }

      </select>

    </div>

    <div>

      <label class="mb-1 block text-[10px] font-semibold uppercase tracking-wider text-slate-500">

        Account Name

      </label>

      <input

        type="text"

        formControlName="accountName"

        placeholder="Corporate Current Account"

        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm">

    </div>

  </div>

  <!-- Row 2 -->

  <div class="grid grid-cols-2 gap-4">

    <div>

      <label class="mb-1 block text-[10px] font-semibold uppercase tracking-wider text-slate-500">

        Account Number

      </label>

      <input

        type="text"

        formControlName="accountNumber"

        placeholder="XXXXXXXXXXXX"

        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm">

    </div>

    <div>

      <label class="mb-1 block text-[10px] font-semibold uppercase tracking-wider text-slate-500">

        IFSC Code

      </label>

      <input

        type="text"

        formControlName="ifscCode"

        placeholder="HDFC0000123"

        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm uppercase">

    </div>

  </div>

  <!-- Row 3 -->

  <div class="grid grid-cols-2 gap-4">

    <div>

      <label class="mb-1 block text-[10px] font-semibold uppercase tracking-wider text-slate-500">

        Branch

      </label>

      <input

        type="text"

        formControlName="branch"

        placeholder="New Delhi"

        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm">

    </div>

    <div>

      <label class="mb-1 block text-[10px] font-semibold uppercase tracking-wider text-slate-500">

        Account Type

      </label>

      <select

        formControlName="accountType"

        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm">

        <option value="">

          Select Type

        </option>

        @for(type of accountTypes; track type){

        <option [value]="type">

          {{ type }}

        </option>

        }

      </select>

    </div>

  </div>

  <!-- Row 4 -->

  <div class="grid grid-cols-2 gap-4">

    <div>

      <label class="mb-1 block text-[10px] font-semibold uppercase tracking-wider text-slate-500">

        Opening Balance

      </label>

      <input

        type="number"

        formControlName="openingBalance"

        class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm">

    </div>

    <div>

      <label class="mb-1 block text-[10px] font-semibold uppercase tracking-wider text-slate-500">

        Currency

      </label>

      <input

        type="text"

        formControlName="currency"

        readonly

        class="w-full rounded-lg border border-gray-300 bg-slate-100 px-3 py-2 text-sm">

    </div>

  </div>

  <!-- Remarks -->

  <div>

    <label class="mb-1 block text-[10px] font-semibold uppercase tracking-wider text-slate-500">

      Remarks

    </label>

    <textarea

      rows="4"

      formControlName="remarks"

      placeholder="Additional information..."

      class="w-full resize-none rounded-lg border border-gray-300 px-3 py-2 text-sm">

    </textarea>

  </div>

  <!-- Footer -->

  <div class="flex justify-end gap-3 border-t border-gray-200 pt-5">

    <button

      type="button"

      (click)="cancel()"

      class="rounded-lg bg-gray-100 px-6 py-2 text-sm font-medium hover:bg-gray-200">

      Cancel

    </button>

    <button

      type="submit"

      class="rounded-lg bg-red-800 px-6 py-2 text-sm font-medium text-white hover:bg-red-900">

      Save Bank Account

    </button>

  </div>

</form>
