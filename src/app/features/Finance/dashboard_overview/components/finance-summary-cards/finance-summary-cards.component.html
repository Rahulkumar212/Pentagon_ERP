<div class="grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4">

  @for (card of summaryCards; track card.id) {

    <div
      class="rounded-lg border border-gray-200 bg-white p-3 shadow-sm transition-all duration-300 hover:-translate-y-0.5 hover:shadow-md">

      <!-- Header -->

      <div class="flex items-center justify-between">

        <p
          class="text-[10px] font-semibold uppercase tracking-[0.14em] text-slate-500">

          {{ card.title }}

        </p>

        <div
          class="flex h-8 w-8 items-center justify-center rounded-lg"
          [ngClass]="card.bgColor">

          <span
            class="material-icons text-[20px]"
            [ngClass]="card.color">

            {{ card.icon }}

          </span>

        </div>

      </div>

      <!-- Amount -->

      <h2
        class="mt-3 text-2xl font-bold leading-none text-slate-900">

        {{ card.value | currency:'INR':'symbol':'1.0-0' }}

      </h2>

      <!-- Footer -->

      <div
        class="mt-2 flex items-center justify-between">

        <span
          class="text-xs font-semibold"
          [ngClass]="card.positive ? 'text-emerald-600' : 'text-red-600'">

          {{ card.positive ? '↗' : '↘' }}
          {{ card.change }}%

        </span>

        <span
          class="text-[10px] text-slate-500">

          {{ card.subtitle }}

        </span>

      </div>

    </div>

  }

</div>
