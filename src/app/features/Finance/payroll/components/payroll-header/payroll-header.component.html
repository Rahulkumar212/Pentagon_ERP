<div class="rounded-xl border border-gray-200 bg-white px-4 py-3 shadow-sm">

  <!-- ================================================= -->
  <!-- HEADER -->
  <!-- ================================================= -->

  <div
    class="flex flex-col gap-4
           lg:flex-row lg:items-center
           lg:justify-between">

    <!-- ================================================= -->
    <!-- LEFT -->
    <!-- ================================================= -->

    <div class="flex items-start gap-3">

      <!-- Icon -->

      <div
        class="flex h-8 w-8 shrink-0
               items-center justify-center
               rounded-lg bg-red-50 text-red-800">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2">

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 8c-2.21 0-4 1.79-4 4v6h8v-6c0-2.21-1.79-4-4-4zm0-6a3 3 0 013 3v2H9V5a3 3 0 013-3v0z" />

        </svg>

      </div>


      <!-- Title -->

      <div>

        <h1
          class="text-base font-semibold text-slate-900">

          Payroll, Wages & Statutory Compensations

        </h1>

        <p
          class="mt-0.5 text-[11px] text-slate-500">

          Calculate employee salaries, process payroll,
          PF, ESI, TDS and direct bank disbursements.

        </p>

      </div>

    </div>


    <!-- ================================================= -->
    <!-- BANK -->
    <!-- ================================================= -->

    <div class="flex items-center gap-2">

      <label
        class="text-xs font-medium text-slate-600">

        Source Account

      </label>

      <select
        [(ngModel)]="selectedBank"
        (change)="onBankChange()"
        class="rounded-lg
               border border-red-300
               bg-white
               px-3 py-1.5
               text-xs
               outline-none
               transition
               focus:border-red-700">

        @for (bank of banks; track bank) {

          <option [value]="bank">

            {{ bank }}

          </option>

        }

      </select>

    </div>

  </div>


  <!-- ================================================= -->
  <!-- PAYROLL TABS -->
  <!-- ================================================= -->

  <div
    class="mt-4
           flex items-center
           gap-1
           overflow-x-auto
           border-t border-gray-100
           pt-3">

    @for (tab of tabs; track tab.id) {

      <button
        type="button"
        (click)="selectTab(tab.id)"
        class="
          whitespace-nowrap
          rounded-lg
          px-4 py-2
          text-xs
          font-semibold
          transition
        "
        [class.bg-red-50]="activeTab === tab.id"
        [class.text-red-800]="activeTab === tab.id"
        [class.text-slate-500]="activeTab !== tab.id"
        [class.hover:bg-gray-50]="activeTab !== tab.id">

        {{ tab.label }}

      </button>

    }

  </div>

</div>
