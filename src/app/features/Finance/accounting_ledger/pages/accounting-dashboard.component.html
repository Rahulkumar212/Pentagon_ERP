<div class="space-y-6">

  <!-- ===================================================== -->
  <!-- Header -->
  <!-- ===================================================== -->

  <app-accounting-header
    [activeTab]="activeTab"
    (tabChange)="setTab($event)"
    (createAccount)="openCreateAccountModal()"
    (createJournal)="openJournalEntryModal()">
  </app-accounting-header>

  <!-- ===================================================== -->
  <!-- Content -->
  <!-- ===================================================== -->

  @switch (activeTab) {

    @case ('accounts') {

      <app-chart-of-accounts-table>
      </app-chart-of-accounts-table>

    }

    @case ('journal') {

      <app-journal-table>
      </app-journal-table>

    }

    @case ('ledger') {

      <app-ledger-table>
      </app-ledger-table>

    }

    @case ('trialBalance') {

      <app-trial-balance-table>
      </app-trial-balance-table>

    }

  }

  <!-- ===================================================== -->
  <!-- Create Account Modal -->
  <!-- ===================================================== -->

  @if (showCreateAccountModal) {

    <app-create-account-modal
      (close)="closeCreateAccountModal()"
      (save)="saveAccount($event)">
    </app-create-account-modal>

  }

  <!-- ===================================================== -->
  <!-- Journal Entry Modal -->
  <!-- ===================================================== -->

  @if (showJournalEntryModal) {

    <app-journal-entry-modal
      (close)="closeJournalEntryModal()"
      (save)="saveJournal($event)">
    </app-journal-entry-modal>

  }

</div>
