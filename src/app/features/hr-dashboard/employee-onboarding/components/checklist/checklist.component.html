<!-- Divider -->
<div class="my-6 border-t border-gray-200"></div>

<!-- Title -->
<h3 class="mb-4 text-xs font-semibold uppercase tracking-[0.2em] text-gray-500">
  Required Formalities
</h3>

<!-- Checklist -->
<div class="grid grid-cols-1 gap-4 md:grid-cols-2">

  @for (item of checklist; track item.id) {

    <div
      class="rounded-xl border border-gray-200 p-4 transition hover:border-red-300 hover:shadow-sm">

      <div class="flex items-start justify-between gap-4">

        <!-- Left -->
        <div class="flex flex-1 items-start gap-4">

          <button
            type="button"
            (click)="toggleItem(item)"
            class="mt-1 flex h-6 w-6 shrink-0 items-center justify-center rounded-full border-2"
            [class.bg-green-600]="item.completed"
            [class.border-green-600]="item.completed"
            [class.border-gray-300]="!item.completed">

            @if (item.completed) {
              <span class="text-xs text-white">
                ✓
              </span>
            }

          </button>

          <div>

            <span
              class="mb-2 inline-block rounded border border-gray-300 px-2 py-1 text-[10px] uppercase tracking-wide">

              {{ item.category }}

            </span>

            <h4 class="font-semibold text-gray-900">
              {{ item.text }}
            </h4>

          </div>

        </div>

        <!-- Right -->
        <div class="shrink-0 text-right">

          <p
            class="text-xs font-semibold"
            [class.text-green-600]="item.completed"
            [class.text-orange-500]="!item.completed">

            {{ item.completed ? 'Completed' : 'Pending' }}

          </p>

        </div>

      </div>

    </div>

  } @empty {

    <div class="col-span-full py-8 text-center text-sm text-gray-500">
      No checklist items found.
    </div>

  }

</div>
