<div class="flex items-start justify-between gap-6">

  <!-- Left -->
  <div class="flex gap-4">

    <!-- Avatar -->
    <div
      class="flex h-16 w-16 items-center justify-center rounded-xl bg-red-100 text-2xl font-bold text-red-800">

      {{ employee.candidateName?.charAt(0)?.toUpperCase() || '?' }}

    </div>

    <!-- Employee Info -->
    <div>

      <h2 class="text-2xl font-serif text-red-900">
        {{ employee.candidateName }}
      </h2>

      <p class="text-gray-600">
        {{ employee.jobTitle }}
      </p>

      <p class="mt-1 text-sm text-gray-500">
        {{ employee.department || '-' }}
      </p>

      <p class="mt-1 text-sm text-gray-500">
        Joining :
        {{ employee.joiningDate | date:'dd MMM yyyy' }}
      </p>

    </div>

  </div>

  <!-- Right -->
  <div class="flex flex-col items-end gap-3">

    <span
      class="rounded-full bg-green-100 px-4 py-2 text-xs font-semibold text-green-700">

      Onboarding

    </span>

    <button
      type="button"
      (click)="onAddEmployee()"
      class="whitespace-nowrap rounded-lg bg-red-800 px-5 py-2 text-xs font-semibold text-white transition-all duration-300 hover:bg-red-900">

      Add Employee

    </button>

  </div>

</div>

<div class="my-6 border-t border-gray-200"></div>
