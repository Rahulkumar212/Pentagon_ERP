<div
  (click)="openProfile()"
  class="bg-white cursor-pointer rounded-lg border border-gray-200 shadow-sm hover:shadow-md transition-all duration-300 p-4 min-h-[240px] flex flex-col">

<!-- Header -->
<div class="flex gap-3">

  <!-- Avatar -->
  <img
    [src]="'https://ui-avatars.com/api/?name=' + employee.fullName + '&background=7f1d1d&color=fff'"
    [alt]="employee.fullName"
    class="w-10 h-10 rounded-lg border border-red-200 shrink-0">

  <!-- Name, Designation & Employee Code -->
  <div class="min-w-0 flex-1">

    <!-- Employee Code - Upper Right -->
    <div class="flex justify-end">

      <span
        class="text-[9px] font-semibold text-red-700 tracking-wide">
        {{ employee.employeeCode }}
      </span>

    </div>

    <!-- Name -->
    <h3
      class="font-semibold text-base text-red-900 truncate">
      {{ employee.fullName }}
    </h3>

    <!-- Designation -->
    <p
      class="text-[10px] uppercase tracking-wide text-gray-500 truncate">
      {{ employee.designation }}
    </p>

  </div>

</div>

  <!-- Divider -->
  <div class="border-t border-red-100 my-3"></div>

  <!-- Details -->
  <div class="space-y-2 text-xs">

    <div class="flex justify-between gap-4">
      <span class="text-gray-500">
        Organization
      </span>

      <span class="font-medium truncate">
        {{ employee.org_name }}
      </span>
    </div>

    <div class="flex justify-between gap-4">
      <span class="text-gray-500">
        Department
      </span>

      <span class="font-medium truncate">
        {{ employee.department }}
      </span>
    </div>

    <div class="flex justify-between gap-4">
      <span class="text-gray-500">
        Email
      </span>

      <span class="font-medium truncate max-w-[160px]">
        {{ employee.workEmail }}
      </span>
    </div>

    <div class="flex justify-between items-center gap-4">
      <span class="text-gray-500">
        Status
      </span>

      <span
        class="px-2 py-0.5 rounded-full text-[9px] font-semibold"
        [ngClass]="{
          'bg-green-100 text-green-700': employee.status === 'Active',
          'bg-blue-100 text-blue-700': employee.status === 'Probation',
          'bg-yellow-100 text-yellow-700': employee.status === 'On Leave'
        }">

        {{ employee.status }}

      </span>
    </div>

  </div>

  <!-- Footer -->
  <div class="mt-auto border-t border-red-100 pt-3 mt-3 text-xs">

    <div class="flex justify-between gap-4">

      <span class="text-gray-500">
        Mobile
      </span>

      <span class="font-medium">
        {{ employee.mobileNumber }}
      </span>

    </div>

  </div>

</div>
