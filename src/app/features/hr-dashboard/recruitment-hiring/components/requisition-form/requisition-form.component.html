=====================================================
<!-- OVERLAY -->
<!-- ===================================================== -->

<div class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-3">

  <!-- =================================================== -->
  <!-- MODAL -->
  <!-- =================================================== -->

  <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto">

    <!-- ================================================= -->
    <!-- HEADER -->
    <!-- ================================================= -->

    <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200">

      <div>

        <h2 class="text-xl font-serif text-red-900">
          Raise New Requisition
        </h2>

        <p class="text-xs text-gray-500 mt-1">
          Create a new hiring request.
        </p>

      </div>


      <button type="button" (click)="onClose()" class="w-8 h-8 rounded-lg hover:bg-gray-100 text-xl text-gray-500">
        ✕
      </button>

    </div>


    <!-- ================================================= -->
    <!-- BODY -->
    <!-- ================================================= -->

    <div class="p-5 space-y-6">


      <!-- ================================================= -->
      <!-- JOB INFORMATION -->
      <!-- ================================================= -->

      <div>

        <h3 class="text-sm font-semibold text-gray-900 mb-3">
          Job Information
        </h3>


        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">


          <!-- ================= JOB TITLE ================= -->

          <div>

            <label class="block mb-1.5 text-xs font-semibold text-gray-700">
              Job Title
              <span class="text-red-600">*</span>
            </label>

            <input type="text" [(ngModel)]="jobTitle" placeholder="Senior React Developer"
              class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-red-700" />

          </div>


          <!-- ================= DEPARTMENT ================= -->

          <div>

            <label class="block mb-1.5 text-xs font-semibold text-gray-700">
              Department
              <span class="text-red-600">*</span>
            </label>

            <select [(ngModel)]="department"
              class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm bg-white focus:outline-none focus:border-red-700">

              <option value="">
                Select Department
              </option>

              <option value="Engineering">
                Engineering
              </option>

              <option value="HR">
                HR
              </option>

              <option value="Finance">
                Finance
              </option>

              <option value="Sales">
                Sales
              </option>

              <option value="Marketing">
                Marketing
              </option>

              <option value="Operations">
                Operations
              </option>

            </select>

          </div>


          <!-- ================= EMPLOYMENT TYPE ================= -->

          <div>

            <label class="block mb-1.5 text-xs font-semibold text-gray-700">
              Employment Type
              <span class="text-red-600">*</span>
            </label>

            <select [(ngModel)]="employmentType"
              class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm bg-white focus:outline-none focus:border-red-700">

              <option value="">
                Select Type
              </option>

              <option value="Full-time">
                Full-time
              </option>

              <option value="Part-time">
                Part-time
              </option>

              <option value="Contract">
                Contract
              </option>

              <option value="Internship">
                Internship
              </option>

              <option value="Temporary">
                Temporary
              </option>

            </select>

          </div>


          <!-- ================= OPENINGS ================= -->

          <div>

            <label class="block mb-1.5 text-xs font-semibold text-gray-700">
              Number of Openings
              <span class="text-red-600">*</span>
            </label>

            <input type="number" min="1" [(ngModel)]="openings" placeholder="1"
              class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-red-700" />

          </div>


          <!-- ================= EXPERIENCE ================= -->

          <div>

            <label class="block mb-1.5 text-xs font-semibold text-gray-700">
              Experience Required
              <span class="text-red-600">*</span>
            </label>

            <input type="text" [(ngModel)]="experienceRequired" placeholder="2 - 4 Years"
              class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-red-700" />

          </div>

        </div>

      </div>


      <!-- ================================================= -->
      <!-- CANDIDATE REQUIREMENTS -->
      <!-- ================================================= -->

      <div>

        <h3 class="text-sm font-semibold text-gray-900 mb-3">
          Candidate Requirements
        </h3>


        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">


          <!-- ================= QUALIFICATION ================= -->

          <div>

            <label class="block mb-1.5 text-xs font-semibold text-gray-700">
              Qualification
              <span class="text-red-600">*</span>
            </label>

            <input type="text" [(ngModel)]="qualification" placeholder="B.Tech / BCA / MCA"
              class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-red-700" />

          </div>


          <!-- ================= LOCATION ================= -->

          <div>

            <label class="block mb-1.5 text-xs font-semibold text-gray-700">
              Job Location
              <span class="text-red-600">*</span>
            </label>

            <input type="text" [(ngModel)]="location" name="location" placeholder="e.g. Delhi, Noida, Gurgaon"
              class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-red-700" />

          </div>


          <!-- ================= SALARY ================= -->

          <div>

            <label class="block mb-1.5 text-xs font-semibold text-gray-700">
              Salary Range
            </label>

            <input type="text" [(ngModel)]="salaryRange" placeholder="₹6 LPA - ₹10 LPA"
              class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-red-700" />

          </div>

        </div>

      </div>


      <!-- ================================================= -->
      <!-- RECRUITMENT DETAILS -->
      <!-- ================================================= -->

      <div>

        <h3 class="text-sm font-semibold text-gray-900 mb-3">
          Recruitment Details
        </h3>


        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">


          <!-- ================= HIRING MANAGER ================= -->

          <div>

            <label class="block mb-1.5 text-xs font-semibold text-gray-700">
              Hiring Manager
              <span class="text-red-600">*</span>
            </label>

            <input type="text" [(ngModel)]="hiringManager" placeholder="Enter hiring manager name"
              class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-red-700" />

          </div>


          <!-- ================= DEADLINE ================= -->

          <div>

            <label class="block mb-1.5 text-xs font-semibold text-gray-700">
              Application Deadline
              <span class="text-red-600">*</span>
            </label>

            <input type="date" [(ngModel)]="applicationDeadline"
              class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-red-700" />

          </div>

        </div>

      </div>


      <!-- ================================================= -->
      <!-- ROLES & REQUIREMENTS -->
      <!-- ================================================= -->

      <div>

        <label class="block mb-1.5 text-xs font-semibold text-gray-700">
          Roles & Requirements
          <span class="text-red-600">*</span>
        </label>

        <textarea rows="6" [(ngModel)]="description"
          placeholder="Enter job responsibilities, required skills, technical knowledge, qualifications and other requirements..."
          class="w-full border border-gray-300 rounded-lg p-3 text-sm resize-none focus:outline-none focus:border-red-700"></textarea>

      </div>

    </div>


    <!-- ================================================= -->
    <!-- FOOTER -->
    <!-- ================================================= -->

    <div class="flex justify-end gap-3 px-5 py-4 border-t border-gray-200 bg-gray-50">

      <button type="button" (click)="onClose()"
        class="px-4 py-2 rounded-lg border border-gray-300 text-sm text-gray-700 hover:bg-gray-100">
        Cancel
      </button>


      <button type="button" (click)="onSubmit()"
        class="px-5 py-2 rounded-lg bg-red-800 hover:bg-red-900 text-white text-sm font-medium">
        Create Requisition
      </button>

    </div>

  </div>

</div>
