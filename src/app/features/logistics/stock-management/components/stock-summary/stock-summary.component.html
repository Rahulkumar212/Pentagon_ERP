<section class="w-full">

  <!-- ===================================================== -->
  <!-- SECTION HEADER -->
  <!-- ===================================================== -->

  <div
    class="mb-4 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between"
  >

    <div>

      <h2
        class="text-base font-semibold text-gray-900"
      >
        Stock Overview
      </h2>

      <p
        class="mt-0.5 text-xs text-gray-500"
      >
        Current inventory status across the main warehouse
      </p>

    </div>


    <!-- Warehouse -->
    <div
      class="inline-flex w-fit items-center gap-2 rounded-full border border-gray-200 bg-white px-3 py-1.5"
    >

      <span
        class="material-symbols-outlined text-[17px] text-gray-600"
      >
        warehouse
      </span>

      <span
        class="text-xs font-medium text-gray-700"
      >
        Main Warehouse
      </span>

    </div>

  </div>


  <!-- ===================================================== -->
  <!-- SUMMARY CARDS -->
  <!-- ===================================================== -->

  <div
    class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6"
  >

    @for (
      card of summaryCards;
      track card.id
    ) {

      <div
        class="group rounded-xl border border-gray-200 bg-white p-4 shadow-sm transition duration-200 hover:-translate-y-0.5 hover:shadow-md"
      >

        <!-- Top -->
        <div
          class="flex items-start justify-between gap-3"
        >

          <!-- Icon -->
          <div
            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl"
            [ngClass]="card.iconBg"
          >

            <span
              class="material-symbols-outlined text-[21px]"
              [ngClass]="card.iconColor"
            >
              {{ card.icon }}
            </span>

          </div>


          <!-- Status -->
          @if (card.status) {

            <span
              class="rounded-full px-2 py-1 text-[10px] font-semibold"
              [ngClass]="card.statusClass"
            >
              {{ card.status }}
            </span>

          }

        </div>


        <!-- Value -->
        <div class="mt-4">

          <p
            class="text-xs font-medium text-gray-500"
          >
            {{ card.title }}
          </p>

          <p
            class="mt-1 text-2xl font-bold tracking-tight"
            [ngClass]="card.valueColor"
          >
            {{ card.value }}
          </p>

        </div>


        <!-- Description -->
        <div
          class="mt-2 flex items-center gap-1.5"
        >

          <span
            class="material-symbols-outlined text-[15px] text-gray-400"
          >
            info
          </span>

          <p
            class="truncate text-[11px] text-gray-500"
            [title]="card.description"
          >
            {{ card.description }}
          </p>

        </div>

      </div>

    }

  </div>

</section>
