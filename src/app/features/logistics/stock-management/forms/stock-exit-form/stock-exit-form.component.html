
<div class="w-full bg-white">

  <!-- HEADER -->
  <div
    class="flex items-start justify-between
           border-b border-gray-200
           px-6 py-5"
  >

    <div>

      <p
        class="text-xs font-semibold uppercase
               tracking-wider text-red-800"
      >
        Stock Management
      </p>

      <h2 class="mt-1 text-xl font-bold text-gray-900">
        New Stock Exit
      </h2>

      <p class="mt-1 text-sm text-gray-500">
        Record material leaving the warehouse.
      </p>

    </div>

    <button
      type="button"
      (click)="close()"
      class="flex h-9 w-9 items-center
             justify-center rounded-lg
             text-xl text-gray-400
             transition hover:bg-gray-100
             hover:text-gray-700"
    >
      ×
    </button>

  </div>


  <!-- FORM -->
  <form
    #stockExitForm="ngForm"
    (ngSubmit)="submit()"
    class="space-y-6 p-6"
  >


    <!-- MATERIAL INFORMATION -->
    <section>

      <div class="mb-4">

        <h3 class="text-sm font-semibold text-gray-900">
          Material Information
        </h3>

        <p class="mt-1 text-xs text-gray-500">
          Select the material being issued from the warehouse.
        </p>

      </div>


      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">


        <!-- ITEM NAME -->
        <div class="md:col-span-2">

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Item Name *
          </label>

          <input
            type="text"
            name="itemName"
            [(ngModel)]="formData.itemName"
            required
            placeholder="e.g. Laptop, Projector, Barcode Scanner"
            class="w-full rounded-lg
                   border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-900
                   outline-none transition
                   placeholder:text-gray-400
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          />

        </div>


        <!-- CATEGORY -->
        <div>

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Category *
          </label>

          <select
            name="category"
            [(ngModel)]="formData.category"
            required
            class="w-full rounded-lg
                   border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-700
                   outline-none
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          >

            <option value="">
              Select Category
            </option>

            <option value="IT EQUIPMENT">
              IT Equipment
            </option>

            <option value="OFFICE EQUIPMENT">
              Office Equipment
            </option>

            <option value="ELECTRONICS">
              Electronics
            </option>

            <option value="FURNITURE">
              Furniture
            </option>

            <option value="STATIONERY">
              Stationery
            </option>

            <option value="DEMO MATERIAL">
              Demo Material
            </option>

            <option value="OTHER">
              Other
            </option>

          </select>

        </div>


        <!-- UNIT -->
        <div>

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Unit *
          </label>

          <select
            name="unit"
            [(ngModel)]="formData.unit"
            required
            class="w-full rounded-lg
                   border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-700
                   outline-none
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          >

            <option value="PCS">
              Pieces
            </option>

            <option value="BOX">
              Box
            </option>

            <option value="SET">
              Set
            </option>

            <option value="KG">
              Kg
            </option>

            <option value="LITRE">
              Litre
            </option>

            <option value="METER">
              Meter
            </option>

            <option value="OTHER">
              Other
            </option>

          </select>

        </div>


        <!-- QUANTITY -->
        <div>

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Exit Quantity *
          </label>

          <input
            type="number"
            name="quantity"
            [(ngModel)]="formData.quantity"
            min="1"
            required
            placeholder="Enter quantity"
            class="w-full rounded-lg
                   border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-900
                   outline-none
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          />

        </div>


        <!-- EXIT TYPE -->
        <div>

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Exit Type *
          </label>

          <select
            name="exitType"
            [(ngModel)]="formData.exitType"
            required
            class="w-full rounded-lg
                   border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-700
                   outline-none
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          >

            <option value="SALES">
              Sales
            </option>

            <option value="DEMO">
              Demo Unit
            </option>

            <option value="OFFICE_USE">
              Office Use
            </option>

            <option value="REPLACEMENT">
              Replacement
            </option>

            <option value="TRANSFER">
              Transfer
            </option>

            <option value="OTHER">
              Other
            </option>

          </select>

        </div>

      </div>

    </section>


    <!-- ISSUE DETAILS -->
    <section
      class="border-t border-gray-200 pt-6"
    >

      <div class="mb-4">

        <h3 class="text-sm font-semibold text-gray-900">
          Issue Details
        </h3>

        <p class="mt-1 text-xs text-gray-500">
          Enter who is receiving the material and where it is going.
        </p>

      </div>


      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">


        <!-- REFERENCE NUMBER -->
        <div>

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Reference Number
          </label>

          <input
            type="text"
            name="referenceNumber"
            [(ngModel)]="formData.referenceNumber"
            placeholder="e.g. SO-1024 / DEMO-001"
            class="w-full rounded-lg
                   border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-900
                   outline-none
                   placeholder:text-gray-400
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          />

        </div>


        <!-- ISSUED TO -->
        <div>

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Issued To *
          </label>

          <input
            type="text"
            name="issuedTo"
            [(ngModel)]="formData.issuedTo"
            required
            placeholder="Employee / Customer / Team"
            class="w-full rounded-lg
                   border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-900
                   outline-none
                   placeholder:text-gray-400
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          />

        </div>


        <!-- DEPARTMENT -->
        <div>

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Department
          </label>

          <input
            type="text"
            name="department"
            [(ngModel)]="formData.department"
            placeholder="e.g. Sales, Operations, HR"
            class="w-full rounded-lg
                   border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-900
                   outline-none
                   placeholder:text-gray-400
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          />

        </div>


        <!-- EXIT DATE -->
        <div>

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Exit Date *
          </label>

          <input
            type="date"
            name="exitDate"
            [(ngModel)]="formData.exitDate"
            required
            class="w-full rounded-lg
                   border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-900
                   outline-none
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          />

        </div>


        <!-- DESTINATION -->
        <div class="md:col-span-2">

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Destination
          </label>

          <input
            type="text"
            name="destination"
            [(ngModel)]="formData.destination"
            placeholder="e.g. Delhi Branch / Customer Site / Office Floor 2"
            class="w-full rounded-lg
                   border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-900
                   outline-none
                   placeholder:text-gray-400
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          />

        </div>

      </div>

    </section>


    <!-- ADDITIONAL INFORMATION -->
    <section
      class="border-t border-gray-200 pt-6"
    >

      <div class="mb-4">

        <h3 class="text-sm font-semibold text-gray-900">
          Additional Information
        </h3>

        <p class="mt-1 text-xs text-gray-500">
          Add the reason and any additional instructions.
        </p>

      </div>


      <div class="grid grid-cols-1 gap-4">


        <!-- REASON -->
        <div>

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Reason
          </label>

          <textarea
            name="reason"
            [(ngModel)]="formData.reason"
            rows="3"
            placeholder="Why is this material leaving the warehouse?"
            class="w-full resize-none
                   rounded-lg border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-900
                   outline-none
                   placeholder:text-gray-400
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          ></textarea>

        </div>


        <!-- REMARKS -->
        <div>

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Remarks
          </label>

          <textarea
            name="remarks"
            [(ngModel)]="formData.remarks"
            rows="3"
            placeholder="Additional notes or instructions..."
            class="w-full resize-none
                   rounded-lg border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-900
                   outline-none
                   placeholder:text-gray-400
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          ></textarea>

        </div>

      </div>

    </section>


    <!-- FOOTER -->
    <div
      class="flex items-center justify-end
             gap-3 border-t border-gray-200
             pt-5"
    >

      <button
        type="button"
        (click)="close()"
        class="rounded-lg border
               border-gray-200
               px-5 py-2.5
               text-sm font-medium
               text-gray-700
               transition hover:bg-gray-50"
      >
        Cancel
      </button>

      <button
        type="submit"
        [disabled]="stockExitForm.invalid"
        class="rounded-lg bg-gray-900
               px-5 py-2.5
               text-sm font-medium
               text-white
               transition hover:bg-gray-800
               disabled:cursor-not-allowed
               disabled:opacity-50"
      >
        Create Stock Exit
      </button>

    </div>

  </form>

</div>
