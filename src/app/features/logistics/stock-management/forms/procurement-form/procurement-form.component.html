
<div class="w-full bg-white">

  <!-- Header -->
  <div
    class="flex items-start justify-between
           border-b border-gray-200
           px-6 py-5"
  >

    <div>

      <p
        class="text-xs font-semibold uppercase
               tracking-wider text-red-800"
      >
        Stock Management
      </p>

      <h2 class="mt-1 text-xl font-bold text-gray-900">
        New Procurement Request
      </h2>

      <p class="mt-1 text-sm text-gray-500">
        Create a request for purchasing required materials.
      </p>

    </div>

    <button
      type="button"
      (click)="close()"
      class="flex h-9 w-9 items-center
             justify-center rounded-lg
             text-xl text-gray-400
             transition hover:bg-gray-100
             hover:text-gray-700"
    >
      ×
    </button>

  </div>


  <!-- Form -->
  <form
    #procurementForm="ngForm"
    (ngSubmit)="submit()"
    class="space-y-6 p-6"
  >


    <!-- MATERIAL INFORMATION -->
    <section>

      <div class="mb-4">

        <h3 class="text-sm font-semibold text-gray-900">
          Material Information
        </h3>

        <p class="mt-1 text-xs text-gray-500">
          Enter the material required for procurement.
        </p>

      </div>


      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">


        <!-- ITEM NAME -->
        <div class="md:col-span-2">

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Item Name *
          </label>

          <input
            type="text"
            name="itemName"
            [(ngModel)]="formData.itemName"
            required
            placeholder="e.g. Laptop, Printer, Barcode Scanner"
            class="w-full rounded-lg
                   border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-900
                   outline-none transition
                   placeholder:text-gray-400
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          />

        </div>


        <!-- CATEGORY -->
        <div>

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Category *
          </label>

          <select
            name="category"
            [(ngModel)]="formData.category"
            required
            class="w-full rounded-lg
                   border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-700
                   outline-none
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          >

            <option value="">
              Select Category
            </option>

            <option value="IT EQUIPMENT">
              IT Equipment
            </option>

            <option value="OFFICE EQUIPMENT">
              Office Equipment
            </option>

            <option value="ELECTRONICS">
              Electronics
            </option>

            <option value="FURNITURE">
              Furniture
            </option>

            <option value="STATIONERY">
              Stationery
            </option>

            <option value="DEMO MATERIAL">
              Demo Material
            </option>

            <option value="OTHER">
              Other
            </option>

          </select>

        </div>


        <!-- UNIT -->
        <div>

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Unit *
          </label>

          <select
            name="unit"
            [(ngModel)]="formData.unit"
            class="w-full rounded-lg
                   border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-700
                   outline-none
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          >

            <option value="PCS">
              Pieces
            </option>

            <option value="BOX">
              Box
            </option>

            <option value="SET">
              Set
            </option>

            <option value="KG">
              Kg
            </option>

            <option value="LITRE">
              Litre
            </option>

            <option value="METER">
              Meter
            </option>

            <option value="OTHER">
              Other
            </option>

          </select>

        </div>


        <!-- QUANTITY -->
        <div>

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Quantity *
          </label>

          <input
            type="number"
            name="quantity"
            [(ngModel)]="formData.quantity"
            min="1"
            required
            placeholder="Enter quantity"
            class="w-full rounded-lg
                   border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-900
                   outline-none
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          />

        </div>


        <!-- SUPPLIER -->
        <div>

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Supplier
          </label>

          <input
            type="text"
            name="supplier"
            [(ngModel)]="formData.supplier"
            placeholder="Enter supplier name"
            class="w-full rounded-lg
                   border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-900
                   outline-none
                   placeholder:text-gray-400
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          />

        </div>

      </div>

    </section>


    <!-- PROCUREMENT DETAILS -->
    <section
      class="border-t border-gray-200 pt-6"
    >

      <div class="mb-4">

        <h3 class="text-sm font-semibold text-gray-900">
          Procurement Details
        </h3>

        <p class="mt-1 text-xs text-gray-500">
          Define priority, expected delivery and estimated cost.
        </p>

      </div>


      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">


        <!-- PRIORITY -->
        <div>

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Priority *
          </label>

          <select
            name="priority"
            [(ngModel)]="formData.priority"
            class="w-full rounded-lg
                   border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-700
                   outline-none
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          >

            <option value="HIGH">
              High
            </option>

            <option value="MEDIUM">
              Medium
            </option>

            <option value="LOW">
              Low
            </option>

          </select>

        </div>


        <!-- EXPECTED DATE -->
        <div>

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Expected Date *
          </label>

          <input
            type="date"
            name="expectedDate"
            [(ngModel)]="formData.expectedDate"
            required
            class="w-full rounded-lg
                   border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-900
                   outline-none
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          />

        </div>


        <!-- ESTIMATED COST -->
        <div>

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Estimated Cost
          </label>

          <div class="relative">

            <span
              class="absolute left-3 top-1/2
                     -translate-y-1/2
                     text-sm text-gray-500"
            >
              ₹
            </span>

            <input
              type="number"
              name="estimatedCost"
              [(ngModel)]="formData.estimatedCost"
              min="0"
              placeholder="0"
              class="w-full rounded-lg
                     border border-gray-200
                     bg-white py-2.5
                     pl-8 pr-3
                     text-sm text-gray-900
                     outline-none
                     focus:border-gray-400
                     focus:ring-2 focus:ring-gray-100"
            />

          </div>

        </div>


        <!-- REQUIRED BY -->
        <div>

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Required By
          </label>

          <input
            type="text"
            name="requiredBy"
            [(ngModel)]="formData.requiredBy"
            placeholder="Department / Employee"
            class="w-full rounded-lg
                   border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-900
                   outline-none
                   placeholder:text-gray-400
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          />

        </div>


        <!-- REASON -->
        <div class="md:col-span-2">

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Procurement Reason
          </label>

          <textarea
            name="reason"
            [(ngModel)]="formData.reason"
            rows="3"
            placeholder="Why is this material required?"
            class="w-full resize-none
                   rounded-lg border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-900
                   outline-none
                   placeholder:text-gray-400
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          ></textarea>

        </div>


        <!-- REMARKS -->
        <div class="md:col-span-2">

          <label
            class="mb-1.5 block text-xs
                   font-medium text-gray-600"
          >
            Remarks
          </label>

          <textarea
            name="remarks"
            [(ngModel)]="formData.remarks"
            rows="3"
            placeholder="Additional notes or instructions..."
            class="w-full resize-none
                   rounded-lg border border-gray-200
                   bg-white px-3 py-2.5
                   text-sm text-gray-900
                   outline-none
                   placeholder:text-gray-400
                   focus:border-gray-400
                   focus:ring-2 focus:ring-gray-100"
          ></textarea>

        </div>

      </div>

    </section>


    <!-- FOOTER -->
    <div
      class="flex items-center justify-end
             gap-3 border-t border-gray-200
             pt-5"
    >

      <button
        type="button"
        (click)="close()"
        class="rounded-lg border
               border-gray-200
               px-5 py-2.5
               text-sm font-medium
               text-gray-700
               transition hover:bg-gray-50"
      >
        Cancel
      </button>

      <button
        type="submit"
        [disabled]="procurementForm.invalid"
        class="rounded-lg bg-gray-900
               px-5 py-2.5
               text-sm font-medium
               text-white
               transition hover:bg-gray-800
               disabled:cursor-not-allowed
               disabled:opacity-50"
      >
        Create Procurement Request
      </button>

    </div>

  </form>

</div>
