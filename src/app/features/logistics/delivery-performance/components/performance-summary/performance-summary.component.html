
<div class="space-y-5">

  <!-- Section Header -->
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h2 class="text-lg font-semibold text-gray-900">
        Delivery Performance Summary
      </h2>

      <p class="mt-1 text-sm text-gray-500">
        Key delivery performance indicators
      </p>
    </div>

    <div
      class="inline-flex w-fit items-center gap-2 rounded-full border border-gray-200 bg-white px-3 py-1.5 text-xs font-medium text-gray-600 shadow-sm"
    >
      <span class="material-symbols-outlined text-[17px] text-gray-500">
        warehouse
      </span>

      Main Warehouse
    </div>
  </div>

  <!-- Summary Cards -->
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3">
    @for (card of summaryCards; track card.id) {
      <div
        class="group rounded-2xl border border-gray-200 bg-white p-5 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md"
      >

        <!-- Top -->
        <div class="flex items-start justify-between gap-4">

          <!-- Icon -->
          <div
            class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl"
            [ngClass]="card.iconBg"
          >
            <span
              class="material-symbols-outlined text-[23px]"
              [ngClass]="card.iconColor"
            >
              {{ card.icon }}
            </span>
          </div>

          <!-- Status -->
          @if (card.status) {
            <span
              class="rounded-full px-2.5 py-1 text-[11px] font-semibold"
              [ngClass]="card.statusClass"
            >
              {{ card.status }}
            </span>
          }
        </div>

        <!-- Value -->
        <div class="mt-5">
          <div
            class="text-2xl font-bold tracking-tight"
            [ngClass]="card.valueColor"
          >
            {{ card.value | number:'1.0-1' }}{{ card.suffix || '' }}
          </div>

          <h3 class="mt-1 text-sm font-semibold text-gray-900">
            {{ card.title }}
          </h3>

          <p class="mt-1 text-xs leading-5 text-gray-500">
            {{ card.description }}
          </p>
        </div>

      </div>
    }
  </div>

</div>
