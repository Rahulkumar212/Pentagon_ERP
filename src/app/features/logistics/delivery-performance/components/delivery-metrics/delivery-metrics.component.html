
<div class="space-y-5">

  <!-- Section Header -->
  <div>
    <h2 class="text-lg font-semibold text-gray-900">
      Delivery Metrics
    </h2>

    <p class="mt-1 text-sm text-gray-500">
      Detailed performance indicators for delivery operations
    </p>
  </div>

  <!-- Metrics -->
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">
    @for (metric of metrics; track metric.id) {

      <div
        class="rounded-2xl border border-gray-200 bg-white p-5 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md"
      >

        <!-- Header -->
        <div class="flex items-start justify-between gap-4">

          <div class="flex items-center gap-3">

            <!-- Icon -->
            <div
              class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl"
              [ngClass]="metric.iconBg"
            >
              <span
                class="material-symbols-outlined text-[23px]"
                [ngClass]="metric.iconColor"
              >
                {{ metric.icon }}
              </span>
            </div>

            <div>
              <h3 class="text-sm font-semibold text-gray-900">
                {{ metric.title }}
              </h3>

              <p class="mt-0.5 text-xs text-gray-500">
                Performance metric
              </p>
            </div>

          </div>

        </div>

        <!-- Value -->
        <div class="mt-5 flex items-end justify-between gap-4">

          <div>
            <span
              class="text-3xl font-bold tracking-tight"
              [ngClass]="metric.iconColor"
            >
              {{ metric.value | number:'1.0-1' }}
            </span>

            <span class="ml-1 text-sm font-semibold text-gray-500">
              {{ metric.suffix }}
            </span>
          </div>

          <span class="text-xs font-medium text-gray-500">
            {{ metric.progressLabel }}
          </span>

        </div>

        <!-- Progress -->
        <div class="mt-4">
          <div class="h-2 w-full overflow-hidden rounded-full bg-gray-100">
            <div
              class="h-full rounded-full transition-all duration-500"
              [ngClass]="metric.progressClass"
              [style.width.%]="metric.progress"
            ></div>
          </div>
        </div>

        <!-- Description -->
        <p class="mt-3 text-xs leading-5 text-gray-500">
          {{ metric.description }}
        </p>

      </div>

    }
  </div>

</div>
