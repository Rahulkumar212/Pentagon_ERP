<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6">

  @for (card of summaryCards; track card.key) {
    <div
      class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md"
    >

      <!-- Header -->
      <div class="flex items-start justify-between gap-3">

        <div>
          <p class="text-sm font-medium text-gray-500">
            {{ card.title }}
          </p>

          <h3 class="mt-2 text-2xl font-bold text-gray-900">
            {{ card.value }}
          </h3>
        </div>

        <!-- Icon -->
        <div
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg"
          [ngClass]="card.iconBg"
        >
          <span
            class="text-lg font-semibold"
            [ngClass]="card.iconColor"
          >
            {{ card.icon }}
          </span>
        </div>

      </div>

      <!-- Bottom Info -->
      <div class="mt-4 flex items-center justify-between">

        <span
          class="text-xs font-medium"
          [ngClass]="card.trendColor"
        >
          {{ card.trend }}
        </span>

        <span class="text-xs text-gray-400">
          {{ card.description }}
        </span>

      </div>

    </div>
  }

</div>
