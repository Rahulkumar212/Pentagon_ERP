
<div class="mt-6 rounded-xl border border-gray-200 bg-white shadow-sm">

  <!-- Header -->
  <div
    class="flex flex-col gap-3 border-b border-gray-200 px-5 py-4 sm:flex-row sm:items-center sm:justify-between"
  >

    <div>
      <h2 class="text-lg font-semibold text-gray-900">
        Order & Shipment Overview
      </h2>

      <p class="mt-1 text-sm text-gray-500">
        Monthly order and shipment performance
      </p>
    </div>

    <select
      class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-700 outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500"
    >
      <option>Last 6 Months</option>
      <option>Last 12 Months</option>
      <option>This Year</option>
    </select>

  </div>

  <!-- Content -->
  <div class="p-5">

    <!-- Legend -->
    <div class="mb-4 flex flex-wrap items-center gap-6">

      <div class="flex items-center gap-2">
        <span class="h-3 w-3 rounded-full bg-red-500"></span>

        <span class="text-sm text-gray-600">
          Orders
        </span>
      </div>

      <div class="flex items-center gap-2">
        <span class="h-3 w-3 rounded-full bg-gray-300"></span>

        <span class="text-sm text-gray-600">
          Shipments
        </span>
      </div>

    </div>

    <!-- ECharts -->
    <div class="h-[320px] w-full">
      <div
        echarts
        [options]="chartOptions"
        class="h-full w-full"
      ></div>
    </div>

    <!-- Summary -->
    <div
      class="mt-6 grid grid-cols-1 gap-4 border-t border-gray-100 pt-5 sm:grid-cols-3"
    >

      <!-- Total Orders -->
      <div class="rounded-xl bg-gray-50 p-4">

        <div class="flex items-center justify-between">

          <div>
            <p class="text-xs text-gray-500">
              Total Orders
            </p>

            <p class="mt-1 text-lg font-semibold text-gray-900">
              {{ totalOrders | number }}
            </p>
          </div>

          <div
            class="flex h-9 w-9 items-center justify-center rounded-lg bg-red-50 text-red-600"
          >
            <span class="material-symbols-outlined text-[20px]">
              shopping_cart
            </span>
          </div>

        </div>

      </div>

      <!-- Total Shipments -->
      <div class="rounded-xl bg-gray-50 p-4">

        <div class="flex items-center justify-between">

          <div>
            <p class="text-xs text-gray-500">
              Total Shipments
            </p>

            <p class="mt-1 text-lg font-semibold text-gray-900">
              {{ totalShipments | number }}
            </p>
          </div>

          <div
            class="flex h-9 w-9 items-center justify-center rounded-lg bg-gray-100 text-gray-600"
          >
            <span class="material-symbols-outlined text-[20px]">
              local_shipping
            </span>
          </div>

        </div>

      </div>

      <!-- Average -->
      <div class="rounded-xl bg-gray-50 p-4">

        <div class="flex items-center justify-between">

          <div>
            <p class="text-xs text-gray-500">
              Average Monthly Orders
            </p>

            <p class="mt-1 text-lg font-semibold text-gray-900">
              {{ averageOrders | number }}
            </p>
          </div>

          <div
            class="flex h-9 w-9 items-center justify-center rounded-lg bg-blue-50 text-blue-600"
          >
            <span class="material-symbols-outlined text-[20px]">
              trending_up
            </span>
          </div>

        </div>

      </div>

    </div>

  </div>

</div>
