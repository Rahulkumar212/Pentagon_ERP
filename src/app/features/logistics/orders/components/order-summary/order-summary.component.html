<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">

  @for (card of summaryCards; track card.key) {

    <div
      class="group rounded-xl border border-gray-200 bg-white p-5 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md"
    >

      <!-- TOP -->
      <div class="flex items-start justify-between gap-4">

        <!-- TITLE + VALUE -->
        <div class="min-w-0">

          <p class="text-sm font-medium text-gray-500">
            {{ card.title }}
          </p>

          <p class="mt-2 text-2xl font-bold tracking-tight text-gray-900">
            {{ card.value }}
          </p>

        </div>

        <!-- ICON -->
        <div
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl text-lg transition-transform duration-200 group-hover:scale-105"
          [ngClass]="[
            card.iconBg,
            card.iconColor
          ]"
        >
          {{ card.icon }}
        </div>

      </div>

      <!-- BOTTOM -->
      <div class="mt-4 flex items-center justify-between gap-2">

        <p class="truncate text-xs text-gray-500">
          {{ card.description }}
        </p>

        <span
          class="shrink-0 rounded-full px-2 py-1 text-[11px] font-semibold"
          [ngClass]="{
            'bg-green-50 text-green-700':
              card.trendType === 'POSITIVE',

            'bg-orange-50 text-orange-700':
              card.trendType === 'WARNING',

            'bg-gray-100 text-gray-600':
              card.trendType === 'NEUTRAL'
          }"
        >
          {{ card.trend }}
        </span>

      </div>

    </div>

  }

</div>
