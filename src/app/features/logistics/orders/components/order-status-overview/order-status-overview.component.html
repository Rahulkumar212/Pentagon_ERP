<div
  class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm"
>
  <!-- HEADER -->
  <div
    class="mb-5 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between"
  >
    <div>
      <h2 class="text-base font-semibold text-gray-900">
        Order Status Overview
      </h2>

      <p class="mt-1 text-xs text-gray-500">
        Track orders across the logistics lifecycle
      </p>
    </div>

    <div class="rounded-lg bg-gray-50 px-3 py-2">
      <p class="text-[11px] font-medium text-gray-500">
        Total Orders
      </p>

      <p class="mt-0.5 text-lg font-bold text-gray-900">
        {{ getTotalOrders() }}
      </p>
    </div>
  </div>

  <!-- STATUS LIST -->
  <div class="space-y-4">

    @for (item of statusOverview; track item.status) {

      <div
        class="rounded-xl border border-gray-100 bg-gray-50/60 p-4"
      >

        <!-- TOP -->
        <div
          class="flex items-center justify-between gap-4"
        >

          <!-- LEFT -->
          <div class="flex min-w-0 items-center gap-3">

            <div
              class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg text-lg"
              [ngClass]="getStatusClass(item.status)"
            >
              {{ item.icon }}
            </div>

            <div class="min-w-0">

              <div class="flex items-center gap-2">

                <h3
                  class="truncate text-sm font-semibold text-gray-900"
                >
                  {{ item.label }}
                </h3>

                <span
                  class="rounded-full px-2 py-0.5 text-[10px] font-semibold"
                  [ngClass]="getStatusClass(item.status)"
                >
                  {{ getPercentage(item.count) }}%
                </span>

              </div>

              <p
                class="mt-0.5 truncate text-xs text-gray-500"
              >
                {{ item.description }}
              </p>

            </div>

          </div>

          <!-- COUNT -->
          <div class="shrink-0 text-right">

            <p class="text-xl font-bold text-gray-900">
              {{ item.count }}
            </p>

            <p class="text-[10px] text-gray-400">
              orders
            </p>

          </div>

        </div>

        <!-- PROGRESS -->
        <div class="mt-3">

          <div
            class="h-2 overflow-hidden rounded-full bg-gray-200"
          >
            <div
              class="h-full rounded-full transition-all duration-300"
              [ngClass]="getProgressClass(item.status)"
              [style.width.%]="getPercentage(item.count)"
            ></div>
          </div>

        </div>

      </div>

    }

  </div>

</div>
