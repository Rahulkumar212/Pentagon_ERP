<div
  class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm"
>
  <!-- HEADER -->
  <div
    class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"
  >
    <div>
      <h2 class="text-base font-semibold text-gray-900">
        Order Filters
      </h2>

      <p class="mt-1 text-xs text-gray-500">
        Find and filter incoming orders
      </p>
    </div>

    <button
      type="button"
      (click)="resetFilters()"
      class="text-sm font-medium text-gray-500 transition-colors hover:text-red-600"
    >
      Reset Filters
    </button>
  </div>

  <!-- SEARCH -->
  <div class="mb-4">
    <label
      class="mb-1.5 block text-xs font-semibold text-gray-600"
    >
      Search
    </label>

    <div class="relative">
      <span
        class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"
      >
        🔍
      </span>

      <input
        type="text"
        [(ngModel)]="filters.search"
        (keyup.enter)="applyFilters()"
        placeholder="Search by Order ID, Customer or Reference..."
        class="w-full rounded-lg border border-gray-200 bg-white py-2.5 pl-10 pr-3 text-sm text-gray-900 outline-none transition focus:border-red-500 focus:ring-2 focus:ring-red-100"
      />
    </div>
  </div>

  <!-- FILTERS -->
  <div
    class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5"
  >

    <!-- SOURCE -->
    <div>
      <label
        class="mb-1.5 block text-xs font-semibold text-gray-600"
      >
        Order Source
      </label>

      <select
        [(ngModel)]="filters.source"
        class="w-full rounded-lg border border-gray-200 bg-white px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-red-500 focus:ring-2 focus:ring-red-100"
      >
        @for (
          option of sourceOptions;
          track option.value
        ) {
          <option [value]="option.value">
            {{ option.label }}
          </option>
        }
      </select>
    </div>

    <!-- ORDER STATUS -->
    <div>
      <label
        class="mb-1.5 block text-xs font-semibold text-gray-600"
      >
        Order Status
      </label>

      <select
        [(ngModel)]="filters.status"
        class="w-full rounded-lg border border-gray-200 bg-white px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-red-500 focus:ring-2 focus:ring-red-100"
      >
        @for (
          option of statusOptions;
          track option.value
        ) {
          <option [value]="option.value">
            {{ option.label }}
          </option>
        }
      </select>
    </div>

    <!-- PAYMENT STATUS -->
    <div>
      <label
        class="mb-1.5 block text-xs font-semibold text-gray-600"
      >
        Payment Status
      </label>

      <select
        [(ngModel)]="filters.paymentStatus"
        class="w-full rounded-lg border border-gray-200 bg-white px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-red-500 focus:ring-2 focus:ring-red-100"
      >
        @for (
          option of paymentStatusOptions;
          track option.value
        ) {
          <option [value]="option.value">
            {{ option.label }}
          </option>
        }
      </select>
    </div>

    <!-- FROM DATE -->
    <div>
      <label
        class="mb-1.5 block text-xs font-semibold text-gray-600"
      >
        From Date
      </label>

      <input
        type="date"
        [(ngModel)]="filters.fromDate"
        class="w-full rounded-lg border border-gray-200 bg-white px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-red-500 focus:ring-2 focus:ring-red-100"
      />
    </div>

    <!-- TO DATE -->
    <div>
      <label
        class="mb-1.5 block text-xs font-semibold text-gray-600"
      >
        To Date
      </label>

      <input
        type="date"
        [(ngModel)]="filters.toDate"
        class="w-full rounded-lg border border-gray-200 bg-white px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-red-500 focus:ring-2 focus:ring-red-100"
      />
    </div>

  </div>

  <!-- ACTIONS -->
  <div
    class="mt-5 flex flex-col-reverse gap-3 border-t border-gray-100 pt-4 sm:flex-row sm:justify-end"
  >
    <button
      type="button"
      (click)="resetFilters()"
      class="rounded-lg border border-gray-200 bg-white px-5 py-2.5 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50"
    >
      Clear
    </button>

    <button
      type="button"
      (click)="applyFilters()"
      class="rounded-lg bg-red-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-red-700"
    >
      Apply Filters
    </button>
  </div>
</div>
