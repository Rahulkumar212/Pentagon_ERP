
<div class="overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm">

  <div class="grid grid-cols-1 divide-y divide-gray-100 sm:grid-cols-2 sm:divide-x sm:divide-y-0 lg:grid-cols-4 xl:grid-cols-7">

    @for (item of kpiItems; track item.key) {

      <div
        class="group relative px-4 py-4 transition-colors duration-200 hover:bg-gray-50"
      >

        <!-- TOP -->
        <div class="flex items-start justify-between gap-3">

          <div class="min-w-0">

            <p
              class="truncate text-[11px] font-semibold uppercase tracking-wide text-gray-400"
            >
              {{ item.title }}
            </p>

            <p
              class="mt-1 text-2xl font-bold tracking-tight"
              [ngClass]="getValueClass(item.type)"
            >
              {{ item.value }}
            </p>

          </div>

          <!-- ICON -->
          <div
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-base transition-transform duration-200 group-hover:scale-105"
            [ngClass]="getIconClass(item.type)"
          >
            {{ item.icon }}
          </div>

        </div>

        <!-- BOTTOM -->
        <div
          class="mt-3 flex items-center justify-between gap-2"
        >

          <p
            class="truncate text-[10px] text-gray-500"
            [title]="item.description"
          >
            {{ item.description }}
          </p>

          <span
            class="shrink-0 text-[10px] font-semibold"
            [ngClass]="getTrendClass(item.trendType)"
          >
            {{ item.trend }}
          </span>

        </div>

        <!-- STATUS INDICATOR -->
        <div
          class="absolute bottom-0 left-0 h-0.5 w-full bg-gray-100"
        >
          <div
            class="h-full w-1/3 rounded-full transition-all duration-300 group-hover:w-1/2"
            [ngClass]="getIconClass(item.type)"
          ></div>
        </div>

      </div>

    }

  </div>

</div>
