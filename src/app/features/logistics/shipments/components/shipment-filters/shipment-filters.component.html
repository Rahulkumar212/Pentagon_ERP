<div class="overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm">

  <!-- HEADER -->
  <div class="flex flex-col gap-3 border-b border-gray-100 px-5 py-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <div class="flex items-center gap-2">
        <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-cyan-50 text-base">
          🔎
        </div>

        <div>
          <h2 class="text-sm font-bold text-gray-900">
            Shipment Filters
          </h2>

          <p class="mt-0.5 text-xs text-gray-500">
            Find shipments by status, carrier and destination
          </p>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2">
      @if (activeFilterCount > 0) {
        <span
          class="rounded-full bg-cyan-50 px-2.5 py-1 text-[10px] font-semibold text-cyan-700"
        >
          {{ activeFilterCount }} Active
        </span>
      }

      <button
        type="button"
        class="text-xs font-medium text-gray-500 transition-colors hover:text-gray-900"
        (click)="resetFilters()"
      >
        Reset
      </button>
    </div>
  </div>

  <!-- FILTER BODY -->
  <div class="p-5">

    <!-- SEARCH -->
    <div class="mb-5">
      <label
        for="shipment-search"
        class="mb-1.5 block text-[11px] font-semibold uppercase tracking-wide text-gray-500"
      >
        Search Shipment
      </label>

      <div class="relative">
        <span
          class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-400"
        >
          🔍
        </span>

        <input
          id="shipment-search"
          type="text"
          [(ngModel)]="filter.search"
          (input)="onSearchChange()"
          placeholder="Shipment no, order no, customer or tracking no..."
          class="w-full rounded-lg border border-gray-200 bg-gray-50 py-2.5 pl-9 pr-3 text-sm text-gray-900 outline-none transition focus:border-cyan-400 focus:bg-white focus:ring-2 focus:ring-cyan-100"
        />
      </div>
    </div>

    <!-- FILTER GRID -->
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-4">

      <!-- STATUS -->
      <div>
        <label
          for="shipment-status"
          class="mb-1.5 block text-[11px] font-semibold uppercase tracking-wide text-gray-500"
        >
          Status
        </label>

        <select
          id="shipment-status"
          [(ngModel)]="filter.status"
          class="w-full rounded-lg border border-gray-200 bg-white px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-cyan-400 focus:ring-2 focus:ring-cyan-100"
        >
          @for (option of statusOptions; track option.value) {
            <option [value]="option.value">
              {{ option.label }}
            </option>
          }
        </select>
      </div>

      <!-- CARRIER -->
      <div>
        <label
          for="shipment-carrier"
          class="mb-1.5 block text-[11px] font-semibold uppercase tracking-wide text-gray-500"
        >
          Carrier
        </label>

        <select
          id="shipment-carrier"
          [(ngModel)]="filter.carrier"
          class="w-full rounded-lg border border-gray-200 bg-white px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-cyan-400 focus:ring-2 focus:ring-cyan-100"
        >
          @for (carrier of carrierOptions; track carrier) {
            <option [value]="carrier">
              {{ carrier === 'ALL' ? 'All Carriers' : carrier }}
            </option>
          }
        </select>
      </div>

      <!-- DESTINATION -->
      <div>
        <label
          for="shipment-destination"
          class="mb-1.5 block text-[11px] font-semibold uppercase tracking-wide text-gray-500"
        >
          Destination
        </label>

        <select
          id="shipment-destination"
          [(ngModel)]="filter.destination"
          class="w-full rounded-lg border border-gray-200 bg-white px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-cyan-400 focus:ring-2 focus:ring-cyan-100"
        >
          @for (destination of destinationOptions; track destination) {
            <option [value]="destination">
              {{ destination === 'ALL' ? 'All Destinations' : destination }}
            </option>
          }
        </select>
      </div>

      <!-- FROM DATE -->
      <div>
        <label
          for="shipment-from-date"
          class="mb-1.5 block text-[11px] font-semibold uppercase tracking-wide text-gray-500"
        >
          From Date
        </label>

        <input
          id="shipment-from-date"
          type="date"
          [(ngModel)]="filter.fromDate"
          class="w-full rounded-lg border border-gray-200 bg-white px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-cyan-400 focus:ring-2 focus:ring-cyan-100"
        />
      </div>

    </div>

    <!-- SECOND ROW -->
    <div class="mt-4 grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-4">

      <!-- TO DATE -->
      <div>
        <label
          for="shipment-to-date"
          class="mb-1.5 block text-[11px] font-semibold uppercase tracking-wide text-gray-500"
        >
          To Date
        </label>

        <input
          id="shipment-to-date"
          type="date"
          [(ngModel)]="filter.toDate"
          class="w-full rounded-lg border border-gray-200 bg-white px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-cyan-400 focus:ring-2 focus:ring-cyan-100"
        />
      </div>

      <!-- FILTER INFO -->
      <div
        class="flex items-center rounded-lg border border-dashed border-gray-200 bg-gray-50 px-4 py-3 md:col-span-1 xl:col-span-2"
      >
        <div class="flex items-start gap-2">
          <span class="mt-0.5 text-sm">
            📍
          </span>

          <div>
            <p class="text-xs font-semibold text-gray-700">
              Tracking filters
            </p>

            <p class="mt-0.5 text-[11px] leading-4 text-gray-500">
              Use status and carrier filters to quickly identify
              shipments that need attention.
            </p>
          </div>
        </div>
      </div>

      <!-- APPLY -->
      <div class="flex items-end">
        <button
          type="button"
          class="w-full rounded-lg bg-gray-900 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-gray-800"
          (click)="applyFilters()"
        >
          Apply Filters
        </button>
      </div>

    </div>

  </div>
</div>
