<div class="space-y-4">

  <!-- Section Header -->
  <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h2 class="text-lg font-semibold text-gray-900">
        Stock Movement Overview
      </h2>

      <p class="text-sm text-gray-500">
        Track all stock entries, exits and inventory movements
      </p>
    </div>

    <div
      class="inline-flex w-fit items-center gap-2 rounded-full border border-gray-200 bg-white px-3 py-1.5 text-xs font-medium text-gray-600"
    >
      <span class="material-symbols-outlined text-[17px] text-red-500">
        warehouse
      </span>

      Main Warehouse
    </div>
  </div>


  <!-- Summary Cards -->
  <div
    class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6"
  >

    @for (card of summaryCards; track card.id) {

      <div
        class="group min-w-0 rounded-xl border border-gray-200 bg-white p-4 shadow-sm transition duration-200 hover:-translate-y-0.5 hover:shadow-md"
      >

        <!-- Top -->
        <div class="flex min-w-0 items-start justify-between gap-3">

          <!-- Content -->
          <div class="min-w-0">

            <p
              class="truncate text-xs font-medium text-gray-500"
              [title]="card.title"
            >
              {{ card.title }}
            </p>

            <p
              class="mt-1 text-2xl font-bold leading-tight tracking-tight"
              [ngClass]="card.valueColor"
            >
              {{ card.value | number }}
            </p>

          </div>


          <!-- Icon -->
          <div
            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl"
            [ngClass]="card.iconBg"
          >
            <span
              class="material-symbols-outlined text-[21px]"
              [ngClass]="card.iconColor"
            >
              {{ card.icon }}
            </span>
          </div>

        </div>


        <!-- Bottom Description -->
        <div class="mt-3 flex min-w-0 items-center justify-between gap-2">

          <p
            class="min-w-0 truncate text-[10px] leading-tight text-gray-500"
            [title]="card.description"
          >
            {{ card.description }}
          </p>

          @if (card.status) {
            <span
              class="shrink-0 rounded-full px-2 py-0.5 text-[9px] font-semibold"
              [ngClass]="card.statusClass"
            >
              {{ card.status }}
            </span>
          }

        </div>

      </div>

    }

  </div>

</div>
