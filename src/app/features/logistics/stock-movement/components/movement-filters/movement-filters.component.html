
<div class="rounded-2xl border border-gray-200 bg-white p-5 shadow-sm">

  <!-- Header -->
  <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">

    <div>
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-[20px] text-red-500">
          filter_alt
        </span>

        <h3 class="text-sm font-semibold text-gray-900">
          Movement Filters
        </h3>
      </div>

      <p class="mt-1 text-xs text-gray-500">
        Search and filter stock movement records
      </p>
    </div>

    <button
      type="button"
      (click)="onClear()"
      class="inline-flex w-fit items-center gap-1.5 rounded-lg border border-gray-200 bg-white px-3 py-2 text-xs font-semibold text-gray-600 transition hover:border-red-200 hover:bg-red-50 hover:text-red-600"
    >
      <span class="material-symbols-outlined text-[16px]">
        restart_alt
      </span>

      Clear Filters
    </button>

  </div>


  <!-- Filters -->
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-6">

    <!-- Search -->
    <div class="xl:col-span-2">

      <label class="mb-1.5 block text-xs font-medium text-gray-600">
        Search
      </label>

      <div class="relative">

        <span
          class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[19px] text-gray-400"
        >
          search
        </span>

        <input
          type="text"
          [(ngModel)]="filters.search"
          (ngModelChange)="onFilterChange()"
          placeholder="Search movement, item, stock code..."
          class="w-full rounded-xl border border-gray-200 bg-gray-50 py-2.5 pl-10 pr-3 text-sm text-gray-900 outline-none transition focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-100"
        />

      </div>

    </div>


    <!-- Movement Type -->
    <div>

      <label class="mb-1.5 block text-xs font-medium text-gray-600">
        Movement Type
      </label>

      <select
        [(ngModel)]="filters.movementType"
        (ngModelChange)="onFilterChange()"
        class="w-full rounded-xl border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-100"
      >

        @for (type of movementTypes; track type.value) {
          <option [value]="type.value">
            {{ type.label }}
          </option>
        }

      </select>

    </div>


    <!-- Status -->
    <div>

      <label class="mb-1.5 block text-xs font-medium text-gray-600">
        Status
      </label>

      <select
        [(ngModel)]="filters.status"
        (ngModelChange)="onFilterChange()"
        class="w-full rounded-xl border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-100"
      >

        @for (status of statuses; track status.value) {
          <option [value]="status.value">
            {{ status.label }}
          </option>
        }

      </select>

    </div>


    <!-- Reference Type -->
    <div>

      <label class="mb-1.5 block text-xs font-medium text-gray-600">
        Reference
      </label>

      <select
        [(ngModel)]="filters.referenceType"
        (ngModelChange)="onFilterChange()"
        class="w-full rounded-xl border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-100"
      >

        @for (reference of referenceTypes; track reference.value) {
          <option [value]="reference.value">
            {{ reference.label }}
          </option>
        }

      </select>

    </div>


    <!-- From Date -->
    <div>

      <label class="mb-1.5 block text-xs font-medium text-gray-600">
        From Date
      </label>

      <input
        type="date"
        [(ngModel)]="filters.fromDate"
        (ngModelChange)="onFilterChange()"
        class="w-full rounded-xl border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-100"
      />

    </div>


    <!-- To Date -->
    <div>

      <label class="mb-1.5 block text-xs font-medium text-gray-600">
        To Date
      </label>

      <input
        type="date"
        [(ngModel)]="filters.toDate"
        (ngModelChange)="onFilterChange()"
        class="w-full rounded-xl border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-100"
      />

    </div>

  </div>

</div>
