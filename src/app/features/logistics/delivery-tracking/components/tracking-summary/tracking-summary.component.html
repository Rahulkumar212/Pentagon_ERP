<section class="w-full">

  <!-- Section Header -->
  <div class="mb-4 flex items-center justify-between">
    <div>
      <h2 class="text-lg font-semibold text-gray-900">
        Delivery Overview
      </h2>

      <p class="mt-1 text-sm text-gray-500">
        Current delivery and shipment status
      </p>
    </div>

    <div
      class="flex items-center gap-2 rounded-lg border border-gray-200 bg-white px-3 py-2"
    >
      <span class="material-symbols-outlined text-[18px] text-gray-500">
        warehouse
      </span>

      <span class="text-sm font-medium text-gray-700">
        Main Warehouse
      </span>
    </div>
  </div>

  <!-- Summary Cards -->
  <div
    class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6"
  >

    @for (card of summaryCards; track card.title) {
      <div
        class="group rounded-xl border border-gray-200 bg-white p-4 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md"
      >

        <!-- Top -->
        <div class="flex items-start justify-between gap-3">

          <!-- Icon -->
          <div
            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg"
            [ngClass]="card.iconBg"
          >
            <span
              class="material-symbols-outlined text-[22px]"
              [ngClass]="card.iconColor"
            >
              {{ card.icon }}
            </span>
          </div>

          <!-- Status Dot -->
          <span
            class="mt-1 h-2 w-2 rounded-full bg-gray-300 transition-colors group-hover:bg-gray-500"
          ></span>

        </div>

        <!-- Value -->
        <div class="mt-4">
          <p
            class="text-2xl font-bold tracking-tight"
            [ngClass]="card.valueColor"
          >
            {{ card.value }}
          </p>

          <p class="mt-1 text-sm font-medium text-gray-700">
            {{ card.title }}
          </p>

          <p class="mt-1 text-xs text-gray-500">
            {{ card.description }}
          </p>
        </div>

      </div>
    }

  </div>

</section>
