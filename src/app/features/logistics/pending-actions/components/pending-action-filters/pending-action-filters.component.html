<div class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm">

  <!-- HEADER -->
  <div
    class="mb-5 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between"
  >
    <div>
      <h2 class="text-base font-semibold text-gray-900">
        Filters
      </h2>

      <p class="mt-1 text-sm text-gray-500">
        Filter pending actions by type, priority and status
      </p>
    </div>

    <button
      type="button"
      class="text-sm font-medium text-gray-600 transition-colors hover:text-red-600"
      (click)="resetFilters()"
    >
      Reset Filters
    </button>
  </div>

  <!-- FILTERS -->
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-4">

    <!-- ACTION TYPE -->
    <div>
      <label
        for="actionType"
        class="mb-2 block text-sm font-medium text-gray-700"
      >
        Action Type
      </label>

      <select
        id="actionType"
        [(ngModel)]="filters.actionType"
        class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-red-500 focus:ring-2 focus:ring-red-100"
      >
        @for (option of actionTypeOptions; track option.value) {
          <option [value]="option.value">
            {{ option.label }}
          </option>
        }
      </select>
    </div>

    <!-- PRIORITY -->
    <div>
      <label
        for="priority"
        class="mb-2 block text-sm font-medium text-gray-700"
      >
        Priority
      </label>

      <select
        id="priority"
        [(ngModel)]="filters.priority"
        class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-red-500 focus:ring-2 focus:ring-red-100"
      >
        @for (option of priorityOptions; track option.value) {
          <option [value]="option.value">
            {{ option.label }}
          </option>
        }
      </select>
    </div>

    <!-- STATUS -->
    <div>
      <label
        for="status"
        class="mb-2 block text-sm font-medium text-gray-700"
      >
        Status
      </label>

      <select
        id="status"
        [(ngModel)]="filters.status"
        class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-red-500 focus:ring-2 focus:ring-red-100"
      >
        @for (option of statusOptions; track option.value) {
          <option [value]="option.value">
            {{ option.label }}
          </option>
        }
      </select>
    </div>

    <!-- DATE -->
    <div>
      <label
        for="date"
        class="mb-2 block text-sm font-medium text-gray-700"
      >
        Date
      </label>

      <input
        id="date"
        type="date"
        [(ngModel)]="filters.date"
        class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-700 outline-none transition focus:border-red-500 focus:ring-2 focus:ring-red-100"
      />
    </div>

  </div>

  <!-- ACTION -->
  <div class="mt-5 flex justify-end">
    <button
      type="button"
      class="inline-flex items-center justify-center rounded-lg bg-red-600 px-5 py-2.5 text-sm font-medium text-white shadow-sm transition-colors hover:bg-red-700"
      (click)="applyFilters()"
    >
      Apply Filters
    </button>
  </div>

</div>
