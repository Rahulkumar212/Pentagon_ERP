<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">

  @for (card of summaryCards; track card.key) {
    <div
      class="rounded-xl border border-gray-200 bg-white p-5 shadow-sm transition-shadow hover:shadow-md"
    >
      <!-- HEADER -->
      <div class="flex items-start justify-between gap-4">

        <!-- TITLE -->
        <div>
          <p class="text-sm font-medium text-gray-500">
            {{ card.title }}
          </p>

          <p
            class="mt-2 text-2xl font-bold"
            [ngClass]="card.valueColor"
          >
            {{ card.value }}
          </p>
        </div>

        <!-- ICON -->
        <div
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl text-lg"
          [ngClass]="[card.iconBg, card.iconColor]"
        >
          {{ card.icon }}
        </div>

      </div>

      <!-- DESCRIPTION -->
      <p class="mt-3 text-xs text-gray-500">
        {{ card.description }}
      </p>
    </div>
  }

</div>
