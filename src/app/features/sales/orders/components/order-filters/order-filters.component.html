
<div
  class="rounded-2xl border border-gray-200 bg-white p-5 shadow-sm"
>

  <!-- Header -->
  <div
    class="mb-5 flex flex-col gap-3
           sm:flex-row sm:items-center sm:justify-between"
  >

    <div>

      <h2
        class="text-base font-semibold text-gray-900"
      >
        Order Filters
      </h2>

      <p
        class="mt-1 text-xs text-gray-500"
      >
        Search and filter sales orders
      </p>

    </div>


    <!-- Clear Filters -->
    <button
      type="button"
      (click)="clearFilters()"
      class="rounded-lg border border-gray-200
             px-3 py-2 text-xs font-medium
             text-gray-600 transition-all duration-150
             hover:border-red-200
             hover:bg-red-50
             hover:text-red-800"
    >
      Clear Filters
    </button>

  </div>


  <!-- Filters -->
  <div
    class="grid grid-cols-1 gap-4
           md:grid-cols-2 xl:grid-cols-5"
  >

    <!-- Search -->
    <div class="xl:col-span-1">

      <label
        class="mb-1.5 block text-xs font-medium
               text-gray-600"
      >
        Search
      </label>

      <div class="relative">

        <span
          class="pointer-events-none absolute left-3 top-1/2
                 -translate-y-1/2 text-sm text-gray-400"
        >
          🔍
        </span>

        <input
          type="text"
          [(ngModel)]="filters.search"
          (ngModelChange)="onFilterChange()"
          placeholder="Order no. / customer"
          class="w-full rounded-xl border border-gray-200
                 bg-gray-50 py-2.5 pl-9 pr-3 text-sm
                 text-gray-800 outline-none transition-all
                 placeholder:text-gray-400
                 focus:border-red-800
                 focus:bg-white
                 focus:ring-2 focus:ring-red-100"
        />

      </div>

    </div>


    <!-- Status -->
    <div>

      <label
        class="mb-1.5 block text-xs font-medium
               text-gray-600"
      >
        Order Status
      </label>

      <select
        [(ngModel)]="filters.status"
        (ngModelChange)="onFilterChange()"
        class="w-full rounded-xl border border-gray-200
               bg-gray-50 px-3 py-2.5 text-sm
               text-gray-800 outline-none transition-all
               focus:border-red-800
               focus:bg-white
               focus:ring-2 focus:ring-red-100"
      >

        <option value="ALL">
          All Status
        </option>

        <option value="PENDING">
          Pending
        </option>

        <option value="PROCESSING">
          Processing
        </option>

        <option value="READY_FOR_DISPATCH">
          Ready for Dispatch
        </option>

        <option value="DISPATCHED">
          Dispatched
        </option>

        <option value="DELIVERED">
          Delivered
        </option>

        <option value="CANCELLED">
          Cancelled
        </option>

      </select>

    </div>


    <!-- Payment Status -->
    <div>

      <label
        class="mb-1.5 block text-xs font-medium
               text-gray-600"
      >
        Payment Status
      </label>

      <select
        [(ngModel)]="filters.paymentStatus"
        (ngModelChange)="onFilterChange()"
        class="w-full rounded-xl border border-gray-200
               bg-gray-50 px-3 py-2.5 text-sm
               text-gray-800 outline-none transition-all
               focus:border-red-800
               focus:bg-white
               focus:ring-2 focus:ring-red-100"
      >

        <option value="ALL">
          All Payments
        </option>

        <option value="PENDING">
          Pending
        </option>

        <option value="PARTIAL">
          Partial
        </option>

        <option value="PAID">
          Paid
        </option>

      </select>

    </div>


    <!-- Priority -->
    <div>

      <label
        class="mb-1.5 block text-xs font-medium
               text-gray-600"
      >
        Priority
      </label>

      <select
        [(ngModel)]="filters.priority"
        (ngModelChange)="onFilterChange()"
        class="w-full rounded-xl border border-gray-200
               bg-gray-50 px-3 py-2.5 text-sm
               text-gray-800 outline-none transition-all
               focus:border-red-800
               focus:bg-white
               focus:ring-2 focus:ring-red-100"
      >

        <option value="ALL">
          All Priority
        </option>

        <option value="HIGH">
          High
        </option>

        <option value="MEDIUM">
          Medium
        </option>

        <option value="LOW">
          Low
        </option>

      </select>

    </div>


    <!-- Date -->
    <div>

      <label
        class="mb-1.5 block text-xs font-medium
               text-gray-600"
      >
        Order Date
      </label>

      <input
        type="date"
        [(ngModel)]="filters.date"
        (ngModelChange)="onFilterChange()"
        class="w-full rounded-xl border border-gray-200
               bg-gray-50 px-3 py-2.5 text-sm
               text-gray-800 outline-none transition-all
               focus:border-red-800
               focus:bg-white
               focus:ring-2 focus:ring-red-100"
      />

    </div>

  </div>

</div>
