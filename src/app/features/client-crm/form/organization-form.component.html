<form [formGroup]="organizationForm" (ngSubmit)="onSubmit()">

  <!-- ================= TABS ================= -->
  <mat-tab-group (selectedTabChange)="onTabChange($event)">

    <mat-tab label="Sales Telecalling">

      <!-- ================= SALES TELECALLING ================= -->

      <div class="flex-1 overflow-y-auto px-4 md:px-8 py-6 bg-gray-50">

        <!-- Employee Information -->
        <div class="bg-white rounded-xl border p-5">

          <h3 class="text-lg font-semibold mb-5">
            Employee Information
          </h3>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

            <div>
              <label class="block text-sm font-medium mb-2">
                Executive Name *
              </label>

              <input type="text" class="w-full rounded-lg border px-4 py-3">
            </div>

            <div>
              <label class="block text-sm font-medium mb-2">
                Designation *
              </label>

              <input type="text" class="w-full rounded-lg border px-4 py-3">
            </div>

            <div>
              <label class="block text-sm font-medium mb-2">
                Date *
              </label>

              <input type="date" class="w-full rounded-lg border px-4 py-3">
            </div>

          </div>

        </div>

        <!-- Daily Call Summary -->

        <div class="bg-white rounded-xl border p-5 mt-6">

          <h3 class="text-lg font-semibold mb-5">
            Daily Call Summary
          </h3>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

            <div>
              <label class="block text-sm font-medium mb-2">
                Total Calls Made *
              </label>

              <input type="number" class="w-full rounded-lg border px-4 py-3">
            </div>

            <div>
              <label class="block text-sm font-medium mb-2">
                Connected Calls *
              </label>

              <input type="number" class="w-full rounded-lg border px-4 py-3">
            </div>

            <div>
              <label class="block text-sm font-medium mb-2">
                Cold Calls *
              </label>

              <input type="number" class="w-full rounded-lg border px-4 py-3">
            </div>

            <div>
              <label class="block text-sm font-medium mb-2">
                Hot Lead Follow-ups *
              </label>

              <input type="number" class="w-full rounded-lg border px-4 py-3">
            </div>

            <div>
              <label class="block text-sm font-medium mb-2">
                Meetings Scheduled *
              </label>

              <input type="number" class="w-full rounded-lg border px-4 py-3">
            </div>

            <div>
              <label class="block text-sm font-medium mb-2">
                Meetings Done *
              </label>

              <input type="number" class="w-full rounded-lg border px-4 py-3">
            </div>

            <div>
              <label class="block text-sm font-medium mb-2">
                New Leads Generated *
              </label>

              <input type="number" class="w-full rounded-lg border px-4 py-3">
            </div>

          </div>

        </div>

        <!-- Client Information -->

        <div class="bg-white rounded-xl border p-5 mt-6">

          <h3 class="text-lg font-semibold mb-5">
            Client Information
          </h3>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

            <div>
              <label class="block text-sm font-medium mb-2">
                Client / Customer Name *
              </label>

              <input type="text" class="w-full rounded-lg border px-4 py-3">
            </div>

            <div>
              <label class="block text-sm font-medium mb-2">
                Contact Person *
              </label>

              <input type="text" class="w-full rounded-lg border px-4 py-3">
            </div>

            <div>
              <label class="block text-sm font-medium mb-2">
                Contact Number *
              </label>

              <input type="text" class="w-full rounded-lg border px-4 py-3">
            </div>

            <div>
              <label class="block text-sm font-medium mb-2">
                City *
              </label>

              <input type="text" class="w-full rounded-lg border px-4 py-3">
            </div>

            <div>
              <label class="block text-sm font-medium mb-2">
                Lead Category *
              </label>

              <select class="w-full rounded-lg border px-4 py-3">

                <option value="">Select Lead</option>
                <option value="HOT_PROSPECTS">Hot Prospect</option>
                <option value="WARM_PROSPECTS">Warm Prospect</option>

              </select>
            </div>

            <!-- Hidden Visit Type -->
            <input type="hidden">

            <div class="md:col-span-2">
              <label class="block text-sm font-medium mb-2">
                Remarks
              </label>

              <textarea rows="4" class="w-full rounded-lg border px-4 py-3"></textarea>
            </div>

          </div>

        </div>

      </div>

    </mat-tab>

    <!-- ================= Sales Physical Meeting ================= -->

    <mat-tab label="Sales Physical Meeting">

      <div class="flex-1 overflow-y-auto px-4 md:px-8 py-6 bg-gray-50">

        <h3 class="text-lg font-semibold mb-5">
          Sales Physical Meeting
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <!-- Employee Name -->
          <div>
            <label class="block text-sm font-medium mb-2">
              Employee Name *
            </label>

            <select class="w-full rounded-lg border px-4 py-3">

              <option value="">Select Name</option>
              <option value="Durga Shankar Mishra">Durga Shankar Mishra</option>
              <option value="Gaurav Shukla">Gaurav Shukla</option>
              <option value="Sheikh Rizwan Ali">Sheikh Rizwan Ali</option>
              <option value="Sunil Patle">Sunil Patle</option>
              <option value="Rajesh Pathak">Rajesh Pathak</option>
              <option value="Monika">Monika</option>
              <option value="Yatendra">Yatendra</option>
              <option value="Shivam">Shivam</option>
              <option value="Vanshika">Vanshika</option>

            </select>
          </div>

          <!-- Reporting Location -->
          <div>
            <label class="block text-sm font-medium mb-2">
              Reporting - Location/Region *
            </label>

            <select class="w-full rounded-lg border px-4 py-3">
              <option value="">Select Location</option>
              <option value="Base Location">Base Location</option>
              <option value="On Tour">On Tour</option>
              <option value="Other">Other</option>
            </select>

            <!-- Show only when Other is selected -->
            <!-- <input  *ngIf="organizationForm.get('reportingLocation')?.value === 'Other'" type="text"
              formControlName="otherReportingLocation"  placeholder="Enter Location"
              class="w-full rounded-lg border px-4 py-3 mt-3" /> -->
          </div>

          <!-- Date -->
          <div>
            <label class="block text-sm font-medium mb-2">
              Date of Activity Report *
            </label>

            <input type="date" class="w-full rounded-lg border px-4 py-3">
          </div>

          <!-- Activity Type -->
          <div>
            <label class="block text-sm font-medium mb-2">
              Activity Type *
            </label>

            <select class="w-full rounded-lg border px-4 py-3">

              <option value="">Select Activity</option>
              <option value="Meeting">Meeting</option>
              <option value="FOLLOW_UP">Follow Up </option>
              <option value="Proposal_Submission">Proposal Submission</option>
              <option value="Payment_Collection">Payment Collection</option>
              <option value="Site Visit">Site Visit</option>
              <option value="Order Closing">Order Closing</option>
              <option value="Complaint Resolution">Complaint Resolution</option>
              <option value="Installation Coordination">Installation Coordination</option>
              <option value="Other">Other</option>

              <!-- <input  *ngIf="organizationForm.get('reportingLocation')?.value === 'Other'" type="text"
                formControlName="otherReportingLocation"  placeholder="Enter Location"
                class="w-full rounded-lg border px-4 py-3 mt-3" /> -->

            </select>
          </div>

          <!-- Client Name -->
          <div>
            <label class="block text-sm font-medium mb-2">
              Client Name *
            </label>

            <input type="text" class="w-full rounded-lg border px-4 py-3">
          </div>

          <!-- Contact Person -->
          <div>
            <label class="block text-sm font-medium mb-2">
              Contact Person Name *
            </label>

            <input type="text" class="w-full rounded-lg border px-4 py-3">
          </div>

          <!-- Contact Number -->
          <div>
            <label class="block text-sm font-medium mb-2">
              Contact Number *
            </label>

            <input type="number" class="w-full rounded-lg border px-4 py-3">
          </div>

          <!-- City -->
          <div>
            <label class="block text-sm font-medium mb-2">
              City *
            </label>

            <input type="text" class="w-full rounded-lg border px-4 py-3">
          </div>

          <!-- Client Type -->
          <div>
            <label class="block text-sm font-medium mb-2">
              New or Existing Client *
            </label>

            <select class="w-full rounded-lg border px-4 py-3">

              <option value="">Select</option>
              <option value="NEW">New Client</option>
              <option value="EXISTING">Existing Client</option>

            </select>
          </div>

          <!-- Lead Priority -->
          <div>
            <label class="block text-sm font-medium mb-2">
              Lead Priority *
            </label>

            <select class="w-full rounded-lg border px-4 py-3">

              <option value="">Select</option>
              <option value="HOT">Hot</option>
              <option value="WARM">Warm</option>
              <option value="COLD">Cold</option>

            </select>
          </div>

          <!-- Discussion Summary -->
          <div class="md:col-span-2">

            <label class="block text-sm font-medium mb-2">
              Discussion Summary *
            </label>

            <textarea rows="4" class="w-full rounded-lg border px-4 py-3"></textarea>

          </div>

          <!-- Current Status -->
          <div>

            <label class="block text-sm font-medium mb-2">
              Current Status *
            </label>

            <select class="w-full rounded-lg border px-4 py-3">

              <option value="">Select Status</option>
              <option value="INTERESTED">Interested Need Follow-up</option>
              <option value="Proposal_FOLLOW_UP">Proposal Follow-up</option>
              <option value="NEGOTIATION">Negotiation</option>
              <option value="PROPOSAL_SENT">Follow-up Pending</option>
              <option value="ORDER_CLOSED">Order Closed</option>
              <option value="NOT_INTERESTED">Not Interested</option>
              <option value="Future_Opportunity">Future Opportunity</option>

            </select>

          </div>

          <!-- Expected Business Value -->
          <div>

            <label class="block text-sm font-medium mb-2">
              Expected Business Value *
            </label>

            <input type="number" class="w-full rounded-lg border px-4 py-3">

          </div>

          <!-- Proposal Sent -->
          <div>

            <label class="block text-sm font-medium mb-2">
              Proposal Sent *
            </label>

            <select class="w-full rounded-lg border px-4 py-3">

              <option value="">Select</option>
              <option value="YES">Yes</option>
              <option value="NO">No</option>

            </select>

          </div>

          <!-- Order Closed -->
          <div>

            <label class="block text-sm font-medium mb-2">
              Order Closed *
            </label>

            <select class="w-full rounded-lg border px-4 py-3">

              <option value="">Select</option>
              <option value="YES">Yes</option>
              <option value="NO">No</option>

            </select>

          </div>

          <!-- Expected Closure Date -->
          <div>

            <label class="block text-sm font-medium mb-2">
              Expected Closure Date
            </label>

            <input type="date" class="w-full rounded-lg border px-4 py-3">

          </div>

          <!-- Next Follow-up Date -->
          <div>

            <label class="block text-sm font-medium mb-2">
              Next Follow-up Date
            </label>

            <input type="date" class="w-full rounded-lg border px-4 py-3">

          </div>

          <!-- Support Required -->
          <div class="md:col-span-2">

            <label class="block text-sm font-medium mb-2">
              Support Required From Management *
            </label>

            <textarea rows="3" class="w-full rounded-lg border px-4 py-3"></textarea>

          </div>

          <!-- Additional Remarks -->
          <div class="md:col-span-2">

            <label class="block text-sm font-medium mb-2">
              Additional Remarks
            </label>

            <textarea rows="3" class="w-full rounded-lg border px-4 py-3"></textarea>

          </div>

          <!-- Upload Meeting Photo -->
          <div class="md:col-span-2">

            <label class="block text-sm font-medium mb-2">
              Upload Meeting Photo
            </label>

            <input type="file" accept="image/*" class="w-full rounded-lg border px-4 py-3">

          </div>

        </div>

      </div>
    </mat-tab>

  </mat-tab-group>

  <!-- Footer -->

  <div class="flex items-center justify-end gap-3 mt-6 pt-4 border-t px-6 pb-6">

    <button type="button" (click)="onCancel()"
      class="px-5 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100">

      Cancel

    </button>

    <button type="submit" [disabled]="organizationForm.invalid || isSubmitting"
      class="px-5 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 disabled:opacity-50">

      {{ isSubmitting ? 'Saving...' : 'Save Visit' }}

    </button>

  </div>

</form>
