<form
  [formGroup]="salesVisitForm"
  (ngSubmit)="onSubmit()"
  novalidate
>

  <div class="flex-1 overflow-y-auto px-4 md:px-8 py-6 bg-gray-50">

    <h3 class="text-lg font-semibold mb-5">
      Sales Physical Meeting
    </h3>


    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

      <!-- Employee -->
      <div>

        <label class="block text-sm font-medium mb-2">
          Employee Name *
        </label>

        <select
          formControlName="executive_name"
          class="w-full rounded-lg border px-4 py-3"
        >

          <option value="">
            Select Name
          </option>

          @for (employee of employees; track employee) {

            <option [value]="employee">
              {{ employee }}
            </option>

          }

        </select>

      </div>


      <!-- Reporting Location -->
      <div>

        <label class="block text-sm font-medium mb-2">
          Reporting - Location/Region *
        </label>

        <select
          formControlName="reporting_location"
          class="w-full rounded-lg border px-4 py-3"
        >

          <option value="">
            Select Location
          </option>

          <option value="Base Location">
            Base Location
          </option>

          <option value="On Tour">
            On Tour
          </option>

          <option value="Other">
            Other
          </option>

        </select>

      </div>


      <!-- Date -->
      <div>

        <label class="block text-sm font-medium mb-2">
          Date of Activity Report *
        </label>

        <input
          type="date"
          formControlName="visit_date"
          class="w-full rounded-lg border px-4 py-3"
        />

      </div>


      <!-- Activity -->
      <div>

        <label class="block text-sm font-medium mb-2">
          Activity Type *
        </label>

        <select
          formControlName="activity_type"
          class="w-full rounded-lg border px-4 py-3"
        >

          <option value="">
            Select Activity
          </option>

          <option value="Meeting">
            Meeting
          </option>

          <option value="FOLLOW_UP">
            Follow Up
          </option>

          <option value="Proposal_Submission">
            Proposal Submission
          </option>

          <option value="Payment_Collection">
            Payment Collection
          </option>

          <option value="Site Visit">
            Site Visit
          </option>

          <option value="Order Closing">
            Order Closing
          </option>

          <option value="Complaint Resolution">
            Complaint Resolution
          </option>

          <option value="Installation Coordination">
            Installation Coordination
          </option>

          <option value="DEMO">
            Demo
          </option>

          <option value="EVENT_EXHIBITION">
            Event / Exhibition
          </option>

          <option value="TENDER">
            Tender
          </option>

          <option value="Other">
            Other
          </option>

        </select>

      </div>


      <!-- Client Type -->
      <div>

        <label class="block text-sm font-medium mb-2">
          New or Existing Client *
        </label>

        <select
          formControlName="client_type"
          class="w-full rounded-lg border px-4 py-3"
        >

          <option value="">
            Select
          </option>

          <option value="NEW">
            New Client
          </option>

          <option value="EXISTING">
            Existing Client
          </option>

        </select>

      </div>


      <!-- Client Name -->
      <div>

        <label class="block text-sm font-medium mb-2">
          Client Name *
        </label>

        @if (salesVisitForm.get('client_type')?.value === 'EXISTING') {

          <select
            formControlName="customer_name"
            class="w-full rounded-lg border px-4 py-3"
          >

            <option value="">
              Select Existing Client
            </option>

            @for (client of existingClients; track client) {

              <option [value]="client">
                {{ client }}
              </option>

            }

          </select>

        } @else {

          <input
            type="text"
            formControlName="customer_name"
            placeholder="Enter client name"
            class="w-full rounded-lg border px-4 py-3"
          />

        }

      </div>


      <!-- Contact Person -->
      <div>

        <label class="block text-sm font-medium mb-2">
          Contact Person Name *
        </label>

        <input
          type="text"
          formControlName="contact_person"
          class="w-full rounded-lg border px-4 py-3"
        />

      </div>


      <!-- Contact Number -->
      <div>

        <label class="block text-sm font-medium mb-2">
          Contact Number *
        </label>

        <input
          type="text"
          formControlName="contact_number"
          class="w-full rounded-lg border px-4 py-3"
        />

      </div>


      <!-- Email -->
      <div>

        <label class="block text-sm font-medium mb-2">
          Email ID *
        </label>

        <input
          type="email"
          formControlName="customer_email"
          class="w-full rounded-lg border px-4 py-3"
        />

      </div>


      <!-- City -->
      <div>

        <label class="block text-sm font-medium mb-2">
          City *
        </label>

        <input
          type="text"
          formControlName="city"
          class="w-full rounded-lg border px-4 py-3"
        />

      </div>


      <!-- Lead Priority -->
      <div>

        <label class="block text-sm font-medium mb-2">
          Lead Priority *
        </label>

        <select
          formControlName="lead_priority"
          class="w-full rounded-lg border px-4 py-3"
        >

          <option value="">
            Select
          </option>

          <option value="HOT">
            Hot
          </option>

          <option value="WARM">
            Warm
          </option>

          <option value="COLD">
            Cold
          </option>

        </select>

      </div>


      <!-- Discussion -->
      <div class="md:col-span-2">

        <label class="block text-sm font-medium mb-2">
          Discussion Summary *
        </label>

        <textarea
          rows="4"
          formControlName="discussion_summary"
          class="w-full rounded-lg border px-4 py-3"
        ></textarea>

      </div>


      <!-- Current Status -->
      <div>

        <label class="block text-sm font-medium mb-2">
          Current Status *
        </label>

        <select
          formControlName="current_status"
          class="w-full rounded-lg border px-4 py-3"
        >

          <option value="">
            Select Status
          </option>

          <option value="INTERESTED">
            Interested Need Follow-up
          </option>

          <option value="Proposal_FOLLOW_UP">
            Proposal Follow-up
          </option>

          <option value="NEGOTIATION">
            Negotiation
          </option>

          <option value="PROPOSAL_SENT">
            Follow-up Pending
          </option>

          <option value="ORDER_CLOSED">
            Order Closed
          </option>

          <option value="NOT_INTERESTED">
            Not Interested
          </option>

          <option value="Future_Opportunity">
            Future Opportunity
          </option>

        </select>

      </div>


      <!-- Business -->
      <div>

        <label class="block text-sm font-medium mb-2">
          Expected Business Value *
        </label>

        <input
          type="number"
          formControlName="expected_business_value"
          min="0"
          class="w-full rounded-lg border px-4 py-3"
        />

      </div>


      <!-- Proposal -->
      <div>

        <label class="block text-sm font-medium mb-2">
          Proposal Sent *
        </label>

        <select
          formControlName="proposal_sent"
          class="w-full rounded-lg border px-4 py-3"
        >

          <option value="">
            Select
          </option>

          <option value="YES">
            Yes
          </option>

          <option value="NO">
            No
          </option>

        </select>

      </div>


      <!-- Order Status -->
      <div>

        <label class="block text-sm font-medium mb-2">
          Order Status *
        </label>

        <select
          formControlName="order_closed"
          class="w-full rounded-lg border px-4 py-3"
        >

          <option value="">
            Select
          </option>

          <option value="YES">
            Order Closed
          </option>

          <option value="NO">
            Order Pending
          </option>

          <option value="ORDER_LOST">
            Order Lost
          </option>

        </select>

      </div>


    @if (salesVisitForm.get('order_closed')?.value === 'ORDER_LOST') {

  <div>

    <label class="block text-sm font-medium mb-2">
      Order Lost Reason *
    </label>

    <input
      type="text"
      formControlName="order_lost_reason"
      placeholder="Enter reason"
      class="w-full rounded-lg border px-4 py-3"
    />

  </div>

}

      <!-- Closure Date -->
      <div>

        <label class="block text-sm font-medium mb-2">
          Expected Closure Date *
        </label>

        <input
          type="date"
          formControlName="expected_closure_date"
          class="w-full rounded-lg border px-4 py-3"
        />

      </div>


      <!-- Followup -->
      <div>

        <label class="block text-sm font-medium mb-2">
          Next Follow-up Date *
        </label>

        <input
          type="date"
          formControlName="next_followup_date"
          class="w-full rounded-lg border px-4 py-3"
        />

      </div>


      <!-- Management Support -->
      <div class="md:col-span-2">

        <label class="block text-sm font-medium mb-2">
          Support Required From Team *
        </label>

        <select
          formControlName="management_support_required"
          class="w-full rounded-lg border px-4 py-3"
        >

          <option value="">
            Select
          </option>

          <option value="YES">
            Yes
          </option>

          <option value="NO">
            No
          </option>

          <option value="Other">
            Other
          </option>

        </select>

      </div>


      <!-- Remarks -->
      <div class="md:col-span-2">

        <label class="block text-sm font-medium mb-2">
          Additional Remarks
        </label>

        <textarea
          rows="3"
          formControlName="additional_remarks"
          class="w-full rounded-lg border px-4 py-3"
        ></textarea>

      </div>


      <!-- Photo -->
      <div class="md:col-span-2">

        <label class="block text-sm font-medium mb-2">
          Upload Meeting Photo
        </label>

        <input
          type="file"
          accept="image/*"
          (change)="onMeetingPhotoChange($event)"
          class="w-full rounded-lg border px-4 py-3"
        />

      </div>

    </div>

  </div>


  <!-- Footer -->
  <div
    class="flex items-center justify-end gap-3 mt-6 pt-4 border-t px-6 pb-6"
  >

    <button
      type="button"
      (click)="onCancel()"
      class="px-5 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100"
    >
      Cancel
    </button>

    <button
      type="submit"
      [disabled]="salesVisitForm.invalid || isSubmitting"
      class="px-5 py-2 rounded-lg bg-blue-600 text-white disabled:opacity-50"
    >
      {{ isSubmitting ? 'Submitting...' : 'Submit' }}
    </button>

  </div>

</form>
