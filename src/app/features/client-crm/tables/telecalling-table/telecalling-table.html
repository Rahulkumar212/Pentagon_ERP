<div class="bg-white border border-gray-200 rounded-xl shadow-sm mt-6 overflow-hidden w-full">

  <!-- Header -->
  <div class="px-5 py-4 border-b border-gray-200">

    <h2 class="text-lg font-semibold text-gray-900">
      Telecalling Records
    </h2>

    <p class="mt-1 text-sm text-gray-500">
      Telecalling activity records
    </p>

  </div>

  <!-- Table -->
  <div class="overflow-x-auto">

    <div class="max-h-[450px] overflow-y-auto">

      <table class="min-w-max w-full whitespace-nowrap">

        <!-- ================= TABLE HEADER ================= -->

        <thead class="bg-gray-100 sticky top-0 z-10">

          <tr class="text-xs uppercase tracking-wide text-gray-600">

            <th class="px-5 py-4 text-left">
              Employee Name
            </th>

            <th class="px-5 py-4 text-left">
              Date of Activity Report
            </th>

            <th class="px-5 py-4 text-left">
              Total Calls Made
            </th>

            <th class="px-5 py-4 text-left">
              Connected Calls
            </th>

            <th class="px-5 py-4 text-left">
              Meetings Scheduled
            </th>

            <th class="px-5 py-4 text-left">
              New Leads Generated
            </th>

            <th class="px-5 py-4 text-left">
              Client Name
            </th>

            <th class="px-5 py-4 text-left">
              Contact Person
            </th>

            <th class="px-5 py-4 text-left">
              Contact Number
            </th>

            <th class="px-5 py-4 text-left">
              Email ID
            </th>

            <th class="px-5 py-4 text-left">
              City
            </th>

            <th class="px-5 py-4 text-left">
              Lead Category
            </th>

            <th class="px-5 py-4 text-left">
              Remarks
            </th>

          </tr>

        </thead>

        <!-- ================= TABLE BODY ================= -->
